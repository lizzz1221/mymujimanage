    clearAutoBindOrders(g,product,null,null,boxIdx);
    for(const x of picks){
      if(product.frozenPins)delete product.frozenPins[boxIdx+'|||'+x.item];
      const price=lookupPrice(g,x.item,pid)||0;
      g.orders.push({id:g.nOid++,nick:x.nick,item:x.item,series:'',qty:1,price,note:'綁',bpId:pid,bind:true,autoBind:true,bindBox:boxIdx,ts:Date.now()});
    }
  });
  closeModal();render();
}
function freezeConfirmedBoxes(g,p){
  if(!p||p.kind==='single')return;
  const info=calcBoxes(g,p);
  const frozen=p.frozenPins||{};
  info.boxes.forEach((box,boxIdx)=>{
    if(box.status!=='成團')return;
    for(const slot of box){
      const key=boxIdx+'|||'+slot.item;
      frozen[key]=slot.buyer
        ?{nick:slot.buyer.nick,bind:!!slot.buyer.bind,oid:slot.buyer.oid||0}
        :{empty:true};
    }
  });
  p.frozenPins=frozen;
}

function stabilizeConfirmedBoxes(g){
  for(const p of(g.boxProducts||[])){
    if(p.kind==='single')continue;
    const frozen=p.frozenPins||{};
    let info=calcBoxes(g,p),changed=false;
    const rows=[...new Set(Object.keys(frozen).map(key=>parseInt(key.split('|||')[0])).filter(Number.isFinite))];
    for(const row of rows){
      const box=info.boxes[row];
      let valid=!!box&&box.status==='成團';
      if(valid){
        for(const[key,pin]of Object.entries(frozen)){
          if(parseInt(key.split('|||')[0])!==row)continue;
          const item=key.slice(key.indexOf('|||')+3);
          const slot=box.find(s=>s.item===item),buyer=slot&&slot.buyer;
          if(pin.empty?!!buyer:(!buyer||(pin.oid?buyer.oid!==pin.oid:buyer.nick!==pin.nick))){valid=false;break;}
        }
      }
      if(!valid){
        for(const key of Object.keys(frozen))if(parseInt(key.split('|||')[0])===row)delete frozen[key];
        changed=true;
      }
    }
    if(changed)info=calcBoxes(g,p);
    freezeConfirmedBoxes(g,p);
    if(p.kind==='blind'&&p.blindOpened)stabilizeBlindAllocation(g,p);
  }
}

function boxOrderPriority(g,item,e,team){
  let type=null,rank=0;
  const member=team[e.nick];
  const pos=member?member[item]:null;
  if(pos){type=pos.t;rank=pos.r||0;}
  else if(e.fixed){
    const applies=e.fixedItems&&e.fixedItems.length?e.fixedItems.includes(item):true;
    if(applies){type=e.fixed==='slot'?'slot':'pick';rank=e.fixedRank||0;}
    else type='member';
  }else if(member)type='member';
  const fixedActive=!g.fixEnded||(g.fixEndAt!=null&&e.oid<g.fixEndAt);
  let cls=3;
  if(e.bind)cls=5;
  else if(type==='slot')cls=fixedActive?0:1;
  else if(type==='pick')cls=1;
  else if(type==='member')cls=2;
  return {cls,rank};
}
function boxOrderTime(o){
  const ts=Number(o?.ts);if(Number.isFinite(ts)&&ts>0)return ts;
  const id=Number(o?.oid??o?.id);return Number.isFinite(id)?id:Number.MAX_SAFE_INTEGER;
}
function compareBoxOrders(a,b,rule,distinct){
  if(a._cls!==b._cls)return a._cls-b._cls;
  if(a._cls===0&&a._rank!==b._rank)return a._rank-b._rank;
  if(a._cls===3){
    if(rule==='single'&&b.qty!==a.qty)return b.qty-a.qty;
    if(rule==='easy'){
      const da=distinct[a.nick]?.size||0,db=distinct[b.nick]?.size||0;
      if(db!==da)return db-da;
    }
  }
  return boxOrderTime(a)-boxOrderTime(b)||(a.oid||Number.MAX_SAFE_INTEGER)-(b.oid||Number.MAX_SAFE_INTEGER)||a.seq-b.seq;
}
function getBoxBindPlan(p,box){
  const bind=p.bindItems||{},order=p.bindOrder||{};
  const candidates=box.filter(s=>s.buyer&&!s.buyer.bind&&(bind[s.item]||0)>0).map(s=>({
    nick:s.buyer.nick,binderItem:s.item,remaining:Math.max(0,parseInt(bind[s.item])||0),
    priority:Number(order[s.item])||0,contentIndex:p.contents.indexOf(s.item)
  })).sort((a,b)=>a.priority-b.priority||a.contentIndex-b.contentIndex);
  const plan=[];
  for(const slot of box.filter(s=>!s.buyer)){
    const candidate=candidates.find(x=>x.remaining>0);
    if(!candidate)break;
    plan.push({item:slot.item,nick:candidate.nick,binderItem:candidate.binderItem,priority:candidate.priority});
    candidate.remaining--;
  }
  return plan;
}
function calcBoxes(g,p){
  const demands={};
  const buyerMap={};
  for(const c of p.contents){demands[c]=0;buyerMap[c]=[];}
  const liftQty={};const liftAdd={};
  for(const o of g.orders){
    if(o.lift&&!o.bind&&p.contents.includes(o.item)&&orderMatches(p,o)){
      liftQty[o.nick]=(liftQty[o.nick]||0)+o.qty;
      liftAdd[o.item]=(liftAdd[o.item]||0)+o.qty;
    }
  }
  let seq=0;const distinct={};
  for(const o of g.orders){
    if(p.contents.includes(o.item)&&orderMatches(p,o)){
      if(!o.all)demands[o.item]=(demands[o.item]||0)+o.qty;
      buyerMap[o.item]=buyerMap[o.item]||[];
      buyerMap[o.item].push({nick:o.nick,qty:o.all?0:o.qty,all:!!o.all,bind:!!o.bind,fixed:o.fixed||null,fixedRank:o.fixedRank||0,fixedItems:o.fixedItems||null,isLift:!!o.lift,oid:o.id||0,ts:o.ts||0,seq});
      if(!o.bind)(distinct[o.nick]=distinct[o.nick]||new Set()).add(o.item);
    }
    seq++;
  }
  const maxDemand=Math.max(0,...Object.values(demands));
  const minDemand=p.contents.length?Math.min(...p.contents.map(c=>demands[c]||0)):0;
  let boxesNeeded=maxDemand;
  if(p.maxBoxes && boxesNeeded>p.maxBoxes) boxesNeeded=p.maxBoxes;
  const bind=p.bindItems||{};
  let surplus=0;
  for(const c of p.contents) surplus+=Math.max(0,boxesNeeded-(demands[c]||0));

  const rule=p.sortRule||'fifo';
  const team=getTeam();
  const boxes=[];
  const remaining={};
  for(const c of p.contents){
    for(const e of (buyerMap[c]||[])){
      const priority=boxOrderPriority(g,c,e,team);
      e._cls=priority.cls;
      e._rank=priority.rank;
    }
    const sortFn=(a,b)=>compareBoxOrders(a,b,rule,distinct);
    const sorted=[...(buyerMap[c]||[])].sort(sortFn);
    const allWinner=sorted.filter(b=>b.all).sort((a,b)=>{
      if(a.isLift!==b.isLift)return a.isLift?-1:1;
      const aTeam=!!team[a.nick],bTeam=!!team[b.nick];
      if(aTeam!==bTeam)return aTeam?-1:1;
      return aTeam?sortFn(a,b):boxOrderTime(a)-boxOrderTime(b)||(a.oid||Number.MAX_SAFE_INTEGER)-(b.oid||Number.MAX_SAFE_INTEGER)||a.seq-b.seq;
    })[0]||null;
    remaining[c]=[];
    const allFill=Math.max(0,boxesNeeded-(demands[c]||0));
    const frozenAll={};
    for(const[key,pin]of Object.entries(p.frozenPins||{})){
      if(!key.endsWith('|||'+c)||!pin||!pin.oid)continue;
      if(sorted.some(b=>b.all&&b.oid===pin.oid))frozenAll[pin.oid]=(frozenAll[pin.oid]||0)+1;
    }
    const frozenAllTotal=Object.values(frozenAll).reduce((sum,n)=>sum+n,0);
    const winnerExtra=Math.max(0,allFill-frozenAllTotal);
    for(const b of sorted){
      const qty=b.all?((frozenAll[b.oid]||0)+(b===allWinner?winnerExtra:0)):b.qty;
      if(b.all){b.qty=qty;if(qty)demands[c]+=qty;}
      for(let i=0;i<qty;i++) remaining[c].push({nick:b.nick,all:b.all,bind:b.bind,fixed:b.fixed,isLift:b.all?false:b.isLift,oid:b.oid});
    }
  }
  const minNoLift=p.contents.length?Math.min(...p.contents.map(c=>(demands[c]||0)-(liftAdd[c]||0))):0;
  const lockN=Math.min(Math.max(0,minNoLift),boxesNeeded);
  const liftersOrder=[];const _seenL={};
  for(const o of [...g.orders].sort((a,b)=>boxOrderTime(a)-boxOrderTime(b)||(a.id||0)-(b.id||0))){
    if(o.lift&&!o.bind&&p.contents.includes(o.item)&&orderMatches(p,o)&&!_seenL[o.nick]){_seenL[o.nick]=1;liftersOrder.push(o.nick);}
  }
  if(liftersOrder.length){
    const styleData={};
    for(const c of p.contents){
      const q=remaining[c];
      const liftUnits=q.filter(u=>u.isLift);
      const nonLift=q.filter(u=>!u.isLift);
      const locked=nonLift.slice(0,lockN);
      const rest=nonLift.slice(lockN);
      const byNick={};const promoUsed={};const normal=[];
      for(const u of liftUnits){(byNick[u.nick]=byNick[u.nick]||[]).push(u);}
      for(const u of rest){
        if(!u.bind&&liftQty[u.nick]>0&&(promoUsed[u.nick]||0)<liftQty[u.nick]){
          promoUsed[u.nick]=(promoUsed[u.nick]||0)+1;u.lifted=true;
          (byNick[u.nick]=byNick[u.nick]||[]).push(u);continue;
        }
        normal.push(u);
      }
      styleData[c]={locked,byNick,normal};
    }
    const blocks={};let offsetTotal=0;
    for(const nick of liftersOrder){
      const size=Math.max(0,...p.contents.map(c=>(styleData[c].byNick[nick]||[]).length));
      blocks[nick]=offsetTotal;offsetTotal+=size;
    }
    for(const c of p.contents){
      const{locked,byNick,normal}=styleData[c];
      const arr=new Array(offsetTotal).fill(null);
      for(const nick of liftersOrder){
        (byNick[nick]||[]).forEach((u,i)=>{arr[blocks[nick]+i]=u;});
      }
      const out=[];let ni=0;
      for(let i=0;i<arr.length;i++)out.push(arr[i]!==null?arr[i]:(ni<normal.length?normal[ni++]:null));
      while(ni<normal.length)out.push(normal[ni++]);
      remaining[c]=locked.concat(out);
    }
    const arrangedNeeded=Math.max(0,...p.contents.map(c=>remaining[c].length));
    boxesNeeded=p.maxBoxes?Math.min(arrangedNeeded,p.maxBoxes):arrangedNeeded;
    surplus=0;
    for(const c of p.contents)surplus+=Math.max(0,boxesNeeded-(demands[c]||0));
  }
  const frozenPins=p.frozenPins||{};
  const layoutPins=g.keepTableOrderOnDelete?(p.layoutPins||{}):{};
  const pins=p.pins||{};
  const reserved={};
  const pinLast=Math.max(-1,...[...Object.keys(frozenPins),...Object.keys(layoutPins),...Object.keys(pins)].map(key=>parseInt(key.split('|||')[0])).filter(Number.isFinite));
  if(pinLast>=boxesNeeded)boxesNeeded=pinLast+1;
  const reservePin=(key,spec,isFrozen)=>{
    const sep=key.indexOf('|||');
    const bi=parseInt(key.slice(0,sep)),item=key.slice(sep+3);
    if(isNaN(bi)||bi>=boxesNeeded||!remaining[item]||Object.prototype.hasOwnProperty.call(reserved,key))return;
    const pin=typeof spec==='string'?{nick:spec}:spec;
    if(pin&&pin.empty){reserved[key]=null;return;}
    let idx=-1;
    if(pin&&pin.oid)idx=remaining[item].findIndex(u=>u&&u.oid===pin.oid&&u.bind===!!pin.bind);
    else if(pin)idx=remaining[item].findIndex(u=>u&&u.nick===pin.nick&&!u.bind);
    if(idx<0&&pin&&!pin.oid)idx=remaining[item].findIndex(u=>u&&u.nick===pin.nick);
    if(idx>=0){const u=remaining[item].splice(idx,1)[0];if(!isFrozen)u.manual=true;reserved[key]=u;}
  };
  for(const[key,pin]of Object.entries(frozenPins))reservePin(key,pin,true);
  for(const[key,pin]of Object.entries(layoutPins))reservePin(key,pin,true);
  for(const[key,nick]of Object.entries(pins))reservePin(key,nick,false);
  let capacityNeeded=boxesNeeded;
  for(const c of p.contents){
    const occupied=Object.keys(reserved).filter(key=>key.endsWith('|||'+c)).length;
    const last=Math.max(-1,...Object.keys(reserved).filter(key=>key.endsWith('|||'+c)).map(key=>parseInt(key.split('|||')[0])).filter(Number.isFinite));
    capacityNeeded=Math.max(capacityNeeded,last+1,remaining[c].length+occupied);
  }
  boxesNeeded=p.maxBoxes?Math.max(pinLast+1,Math.min(capacityNeeded,p.maxBoxes)):capacityNeeded;
  surplus=0;
  for(const c of p.contents)surplus+=Math.max(0,boxesNeeded-(demands[c]||0));
  let complete=0,bindComplete=0;
  for(let i=0;i<boxesNeeded;i++){
    const box=p.contents.map(c=>{
      const key=i+'|||'+c;
      const buyer=Object.prototype.hasOwnProperty.call(reserved,key)?reserved[key]:(remaining[c].shift()||null);
      return {item:c,buyer};
    });
    const emptySlots=box.filter(s=>!s.buyer);
    box.bindPlan=getBoxBindPlan(p,box);
    if(!emptySlots.length){
      if(box.some(s=>s.buyer&&s.buyer.bind)){box.status='含綁成團';bindComplete++;}
      else{box.status='成團';complete++;}
    } else if(box.bindPlan.length===emptySlots.length){
      box.status='含綁成團';bindComplete++;
    } else box.status='未成團';
    boxes.push(box);
  }

  return {demands,buyerMap,maxDemand,minDemand,boxesNeeded,complete,bindComplete,surplus,boxes};
}

function payTotal(g,nick,computed){
  const p=(g.pay||{})[nick];
  return p&&p.totalOv!=null?p.totalOv:computed;
}
function renderPayTab(g){
  const totals={};
  for(const o of getConfirmedOrders(g)){totals[o.nick]=(totals[o.nick]||0)+o.qty*effPrice(g,o);}
  const pay=g.pay||{};
  const team=getTeam();
  const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="card"><h3>收款狀況</h3>`;
  if(!sorted.length){h+=`<div class="empty">無資料</div>`;}
  else{
    h+=`<div style="overflow-x:auto"><table><thead><tr><th>暱稱</th><th>應付總額</th><th>已收款項</th><th>狀態</th><th>備註</th>${RO?'':'<th>個人備註</th>'}<th></th></tr></thead><tbody>`;
    for(const[nick,computed]of sorted){
      const p=pay[nick]||{paid:0,note:''};
      const total=payTotal(g,nick,computed);
      const isOv=p.totalOv!=null;
      const diff=total-(p.paid||0);
      let st;
      if(!p.paid) st='<span class="badge b-amber">未收款</span>';
      else if(diff>0) st=`<span class="badge b-red">餘款 $${diff.toLocaleString()}</span>`;
      else if(diff<0) st=`<span class="badge b-purple">溢收 $${(-diff).toLocaleString()}</span>`;
      else st='<span class="badge b-green">已付清</span>';
      h+=`<tr><td>${team[nick]?`<span style="color:#a32d2d;font-weight:bold">${esc(nick)}</span>`:esc(nick)}</td>
        <td>$${total.toLocaleString()}${isOv?'<span style="color:#d16277;font-weight:bold">*</span>':''}</td><td>${p.paid?'$'+p.paid.toLocaleString():'-'}</td><td>${st}</td>
        <td class="muted" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.note||'')}</td>
        ${RO?'':`<td class="muted" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8a75c9">${esc(p.pnote||'')}</td>`}
        <td><button class="bs bg" onclick="showPayModal(${g.id},'${encodeURIComponent(nick)}')">編輯</button></td></tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;return h;
}
function showPayModal(gid,nickEnc){
  const nick=decodeURIComponent(nickEnc);
  const g=getG(gid);if(!g)return;
  const computed=getConfirmedOrders(g).filter(o=>o.nick===nick).reduce((s,o)=>s+o.qty*effPrice(g,o),0);
  const p=(g.pay||{})[nick]||{paid:0,note:''};
  const total=payTotal(g,nick,computed);
  openModal(`<h3>${esc(nick)} 收款</h3>
    <p class="muted" style="margin-bottom:8px">系統計算應付 $${computed.toLocaleString()}${p.totalOv!=null?`　（目前手動改為 $${p.totalOv.toLocaleString()}）`:''}</p>
    <div class="form-row">

    </div>
    <div class="form-group" style="margin-bottom:10px"><label>備註（團員看得到）</label><input id="payNote" value="${esc(p.note||'')}"></div>
    <div class="form-group" style="margin-bottom:10px"><label>個人備註（僅後台可見）</label><input id="payPNote" value="${esc(p.pnote||'')}"></div>
    <div class="btn-row">
      <button class="bs" onclick="document.getElementById('payAmt').value=document.getElementById('payTotal').value">填入全額</button>
      <button class="bs" onclick="document.getElementById('payTotal').value=${computed}">還原系統計算</button>
      <button class="bp" onclick="savePay(${gid},'${encodeURIComponent(nick)}',${computed})">儲存</button>
      <button onclick="closeModal()">取消</button></div>`);
  setTimeout(()=>$('#payAmt').focus(),100);
}
function savePay(gid,nickEnc,computed){
  const nick=decodeURIComponent(nickEnc);
  const paid=parseFloat($('#payAmt').value)||0;
  const note=$('#payNote').value.trim();
  const pnote=$('#payPNote').value.trim();
  const totalIn=parseFloat($('#payTotal').value);
  upG(gid,g=>{
    if(!g.pay)g.pay={};
    const rec={paid,note};
    if(pnote)rec.pnote=pnote;
    if(!isNaN(totalIn)&&totalIn!==computed)rec.totalOv=totalIn;
    g.pay[nick]=rec;
  });
  closeModal();render();
}

function markArrival(g,newStatus){
  const arrived=['已到貨','已結團'].includes(newStatus);
  if(arrived&&!g.arrivedAt)g.arrivedAt=Date.now();
  if(!arrived&&g.arrivedAt)delete g.arrivedAt;
}
function saveGroupSettings(id){

    g.type=$('#gsType').value;
    g.desc=$('#gsDesc').value.trim();
    g.status=$('#gsStatus').value;
    markArrival(g,g.status);
    // 手動指定到貨日期優先（中午起算避免時區誤差）
    const av=$('#gsArrived')?.value;
    if(av)g.arrivedAt=new Date(av+'T12:00').getTime();
    const dv=$('#gsDate').value;if(dv)g.createdAt=dv.replace(/-/g,'/');

    g.starGroup=$('#gsStar')?.checked||false;

    g.coverPosX=parseInt($('#gCoverX')?.value)||50;

  });

}

function exportSummaryXls(gid){
  const g=getG(gid);if(!g)return;
  const bps=g.boxProducts||[];
  if(!bps.length){alert('尚無商品');return;}
  const confirmed=getConfirmedOrders(g);
  const pay=g.pay||{};
  const ship=g.ship||{};

  const byNick={};
  for(const o of confirmed){
    if(!byNick[o.nick])byNick[o.nick]={perBp:{},total:0,keys:[]};
    const b=byNick[o.nick];
    const bp=bps.find(p=>orderMatches(p,o)&&p.contents.includes(o.item));
    const bpKey=bp?bp.id:'_none';
    if(!b.perBp[bpKey])b.perBp[bpKey]={};
    b.perBp[bpKey][o.item]=(b.perBp[bpKey][o.item]||0)+o.qty;
    b.total+=o.qty*effPrice(g,o);
    b.keys.push(`${o.bpId||''}|||${o.item}|||${o.bind?1:0}|||${o.nick}`);
  }
  const nicks=Object.keys(byNick).sort((a,b)=>byNick[b].total-byNick[a].total);

  const css=`<style>
    td,th{border:1px solid #bbb;padding:4px 8px;font-size:11pt;font-family:Arial,sans-serif;white-space:nowrap}
    th{background:#9ec13f;color:#fff;font-weight:bold;text-align:center}
    .ctr{text-align:center}
    .num{text-align:right}
    .due{background:#f8cecc;color:#cc0000;font-weight:bold;text-align:right}
    .ok{background:#d5e8d4;color:#274e13;text-align:center}
  </style>`;

  let html=`<table cellspacing="0">
    <tr><td colspan="${bps.length+6}" style="font-size:14pt;font-weight:bold;border:none">${esc(g.name)} — 總表</td></tr>
    <tr><th>暱稱</th>${bps.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th>總金額</th><th>已付金額</th><th>餘款</th><th>出貨狀況</th><th>備註</th></tr>`;
  for(const nick of nicks){
    const b=byNick[nick];
    const paid=(pay[nick]&&pay[nick].paid)||0;
    const total=payTotal(g,nick,b.total);
    const isOv=pay[nick]&&pay[nick].totalOv!=null;
    const diff=total-paid;
    const allShipped=b.keys.length&&b.keys.every(k=>ship[k]&&ship[k].s);
    html+=`<tr><td class="ctr" style="font-weight:bold">${esc(nick)}</td>`;
    for(const p of bps){
      const items=b.perBp[p.id]||{};
      const cell=Object.entries(items).map(([item,qty])=>{
        const single=p.contents.length===1&&p.contents[0]===p.name;
        return `${single?'':esc(item)}${qty}`;
      }).join('、');
      html+=`<td class="ctr">${cell||''}</td>`;
    }
    html+=`<td class="num">${total.toLocaleString()}${isOv?'*':''}</td>
      <td class="num">${paid?paid.toLocaleString():''}</td>
      <td class="${diff>0?'due':'ok'}">${diff>0?diff.toLocaleString():'已付清'}</td>
      <td class="ctr">${allShipped?'已出貨':'未出貨'}</td>
      <td>${esc((pay[nick]&&pay[nick].note)||'')}</td></tr>`;
  }
  const grandTotal=nicks.reduce((s,n)=>s+payTotal(g,n,byNick[n].total),0);
  const grandPaid=nicks.reduce((s,n)=>s+((pay[n]&&pay[n].paid)||0),0);
  html+=`<tr><td class="ctr" style="font-weight:bold">總計</td>${bps.map(()=>'<td></td>').join('')}
    <td class="num" style="font-weight:bold">${grandTotal.toLocaleString()}</td>
    <td class="num" style="font-weight:bold">${grandPaid.toLocaleString()}</td>
    <td class="num" style="font-weight:bold;color:#cc0000">${Math.max(0,grandTotal-grandPaid).toLocaleString()}</td>
    <td></td><td></td></tr>`;
  html+='</table>';

  const file=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8">${css}</head><body>${html}</body></html>`;
  const blob=new Blob(['﻿'+file],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${g.name}_總表.xls`;a.click();
}

function bulkAdd(id){
  const text=$('#bulkIn').value.trim();if(!text)return;
  const lines=text.split('\n').filter(l=>l.trim());
  const g=getG(id);
  const parsed=[];
  const dupCheck={};
  for(const line of lines){
    const p=line.split(/[\/,，]/).map(s=>s.trim());if(p.length<2)continue;
    const nick=p[0],item=p[1];
    const bp=(g.boxProducts||[]).find(b=>b.contents.includes(item));
    const bpId=bp?bp.id:null;
    const key=nick+'|||'+item+'|||'+(bpId||'');
    if(dupCheck[key]){alert(`批次中 ${nick} 的「${item}」重複了`);return;}
    dupCheck[key]=true;
    if(g.orders.some(o=>!o.bind&&o.nick===nick&&o.item===item&&(o.bpId||null)===bpId)){alert(`${nick} 已經有「${item}」的喊單，不可重複`);return;}
    parsed.push(p);
  }
  let c=0;
  upG(id,g=>{
    const affected=new Set();
    for(const row of parsed){
      const product=(g.boxProducts||[]).find(b=>b.contents.includes(row[1]));
      if(product&&product.kind!=='single'&&!affected.has(product.id)){
        freezeConfirmedBoxes(g,product);affected.add(product.id);
      }
    }
    for(const p of parsed){
    const bp=(g.boxProducts||[]).find(b=>b.contents.includes(p[1]));
    const bpId=bp?bp.id:null;
    if(bp)clearAutoBindOrders(g,bp,p[1],parseInt(p[2])||1);
    const manualPrice=parseFloat(p[3])||0;
    const price=manualPrice||lookupPrice(g,p[1],bpId)||0;
    g.orders.push({id:g.nOid++,nick:p[0],item:p[1],series:'',qty:parseInt(p[2])||1,price,note:'',bpId,ts:Date.now()});c++;
  }});
  if(c){alert(`匯入 ${c} 筆`);render();}
}

function checkStock(g,itemName,addQty){
  if(g.type!=='carry')return null;
  const it=(g.items||[]).find(i=>i.name===itemName);
  if(!it||!it.stock)return null;
  const used=g.orders.filter(o=>o.item===itemName).reduce((s,o)=>s+o.qty,0);
  const remain=it.stock-used;
  if(addQty>remain) return {item:itemName,stock:it.stock,used,remain};
  return null;
}

        freezeConfirmedBoxes(g,product);affected.add(product.id);
      }
    }
    for(const e of entries){
      const product=e.bpId?(g.boxProducts||[]).find(b=>b.id===e.bpId):(g.boxProducts||[]).find(b=>b.contents.includes(e.item));

      g.orders.push({id:g.nOid++,nick,item:e.item,series:'',qty:e.qty,price:e.price,note:e.note,bpId:e.bpId,all:e.all,lift:isLift,ts:Date.now()});

function saveOrderEdit(gid,oid){
  const g=getG(gid);const o=g.orders.find(x=>x.id===oid);if(!o)return;
  const newNick=$('#eON').value.trim()||o.nick;
  const newItem=$('#eOI').value.trim()||o.item;
  const newQty=parseInt($('#eOQ').value)||1;
  const newAll=!!$('#eOAll')?.checked;
  const newTs=new Date($('#eOTs').value).getTime();
  if(!Number.isFinite(newTs)){alert('請輸入正確的喊單時間');return;}
  if(newItem!==o.item||newNick!==o.nick){
    if(g.orders.some(x=>x.id!==oid&&x.nick===newNick&&x.item===newItem&&(x.bpId||null)===(o.bpId||null))){alert(`${newNick} 已經有「${newItem}」的喊單，不可重複`);return;}
  }
  const isLift=!!$('#eOLift')?.checked;
  upG(gid,g=>{const o=g.orders.find(x=>x.id===oid);if(!o)return;
    const product=o.bpId?(g.boxProducts||[]).find(p=>p.id===o.bpId):(g.boxProducts||[]).find(p=>p.contents.includes(o.item));

function imgFileToData(f,cb,max,quality){
  if(!f)return;
  max=max||500;
  quality=quality||0.75;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/img.width);
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',quality));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

function remapProductSlotKeys(obj,renameMap){
  if(!obj)return obj;
  const out={};
  for(const[key,value]of Object.entries(obj)){
    const sep=key.indexOf('|||');
    if(sep<0){out[key]=value;continue;}
    const item=key.slice(sep+3),next=renameMap[item]||item;
    out[key.slice(0,sep+3)+next]=value;
  }
  return out;
}
function renameProductContents(g,p,oldContents,newContents){
  const renameMap={};
  oldContents.forEach((oldName,i)=>{const next=newContents[i];if(next&&next!==oldName)renameMap[oldName]=next;});
  if(!Object.keys(renameMap).length)return;
  for(const o of(g.orders||[])){
    const belongs=o.bpId?o.bpId===p.id:oldContents.includes(o.item);
    if(belongs&&renameMap[o.item])o.item=renameMap[o.item];
  }
  p.pins=remapProductSlotKeys(p.pins,renameMap);
  p.frozenPins=remapProductSlotKeys(p.frozenPins,renameMap);
  p.layoutPins=remapProductSlotKeys(p.layoutPins,renameMap);
  p.rowPrices=remapProductSlotKeys(p.rowPrices,renameMap);
  for(const field of ['bindItems','bindOrder']){
    if(!p[field])continue;
    const next={};for(const[key,value]of Object.entries(p[field]))next[renameMap[key]||key]=value;p[field]=next;
  }
  if(p.blindCounts){
    const next={};for(const[key,value]of Object.entries(p.blindCounts))next[renameMap[key]||key]=value;p.blindCounts=next;
  }
  if(p.blindAllocPins){
    const next={};for(const[key,value]of Object.entries(p.blindAllocPins))next[renameMap[key]||key]=value;p.blindAllocPins=next;
  }
  if(p.blindBaseline)for(const row of p.blindBaseline)if(renameMap[row.item])row.item=renameMap[row.item];
  if(g.ship){
    const moved={};
    for(const[key,value]of Object.entries(g.ship)){
      const parts=key.split('|||');
      if(String(parts[0])===String(p.id)&&renameMap[parts[1]])parts[1]=renameMap[parts[1]];
      moved[parts.join('|||')]=value;
    }
    g.ship=moved;
  }
}

let _lastPrioResult=null;
function calcPriority(gid){
  const g=getG(gid);if(!g.orders.length){$('#prioResult').innerHTML='<div class="empty">無喊單</div>';return;}
  const mode=$('#prioMode').value,passRule=$('#passRule').checked;
  const bO={};
  for(const o of g.orders){if(!bO[o.nick])bO[o.nick]=[];bO[o.nick].push({...o});}
  const tots={};
  for(const[nick,ords]of Object.entries(bO)){const q=ords.reduce((s,o)=>s+o.qty,0),a=ords.reduce((s,o)=>s+o.qty*effPrice(g,o),0);tots[nick]={q,a,score:mode==='quantity'?q:a};}
  const sorted=Object.keys(tots).sort((a,b)=>tots[b].score-tots[a].score);
  const stocks={};for(const it of(g.items||[])){if(it.stock>0)stocks[it.name]=it.stock;}
  const rem={...stocks};const hasL=Object.keys(stocks).length>0;
  const alloc={};
  for(const nick of sorted){alloc[nick]=[];for(const o of bO[nick]){const l=rem[o.item]!==undefined;let got=o.qty,lost=0;if(l){got=Math.min(o.qty,rem[o.item]);lost=o.qty-got;rem[o.item]-=got;}alloc[nick].push({item:o.item,want:o.qty,got,lost,limited:l,price:effPrice(g,o)});}}
  _lastPrioResult={gid,alloc,sorted};

  let h=`<div class="card"><h3>排名</h3><p class="muted" style="margin-bottom:8px">依${mode==='quantity'?'總數量':'總金額'}${passRule?' · 缺A pass B':''}</p>
    <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>暱稱</th><th>總數量</th><th>總金額</th><th>分數</th></tr></thead><tbody>`;
  sorted.forEach((nick,i)=>{const t=tots[nick];h+=`<tr><td>${i+1}</td><td>${esc(nick)}</td><td>${t.q}</td><td>$${t.a.toLocaleString()}</td><td><span class="badge b-blue">${t.score}</span></td></tr>`;});
  h+=`</tbody></table></div></div>`;

  if(hasL){
    h+=`<div class="card"><h3>分配明細</h3>
      <div class="btn-row" style="margin-bottom:10px"><button class="bp" onclick="deductPriority()">扣除本次帶多結果</button>
      <button onclick="exportPrioXls()">匯出帶多結果</button>
      <span class="muted">從喊單中移除本次已分配的數量，方便進行下一輪計算</span></div>`;
    for(const nick of sorted){
      const hasLost=alloc[nick].some(a=>a.lost>0);
      h+=`<div style="margin-bottom:12px;padding:10px;background:#fef7fa;border-radius:8px"><div style="margin-bottom:6px"><strong>${esc(nick)}</strong> <span class="badge b-purple">#${sorted.indexOf(nick)+1}</span>`;
      if(passRule&&hasLost)h+=` <span class="badge b-amber">缺A pass B</span>`;
      h+=`</div><table><thead><tr><th>商品</th><th>喊</th><th>得</th><th>缺</th><th>狀態</th></tr></thead><tbody>`;
      for(const a of alloc[nick]){
        let st='';if(!a.limited)st='<span class="badge b-gray">無限制</span>';
        else if(a.lost>0&&a.got>0)st='<span class="badge b-amber">部分</span>';
        else if(a.lost>0)st='<span class="badge b-red">未得</span>';
        else st='<span class="badge b-green">取得</span>';
        if(passRule&&hasLost&&a.got>0&&a.lost===0&&a.limited)st+=' <span class="badge b-amber">必買</span>';
        h+=`<tr><td>${esc(a.item)}</td><td>${a.want}</td><td>${a.got}</td><td>${a.lost}</td><td>${st}</td></tr>`;
      }
      h+=`</tbody></table></div>`;
    }
    h+=`</div>`;
  } else h+=`<div class="card"><p class="muted">到「商品庫存」設定數量後才能計算分配</p></div>`;
  $('#prioResult').innerHTML=h;
}
function deductPriority(){
  if(!_lastPrioResult){alert('請先計算帶多結果');return;}
  const{gid,alloc}=_lastPrioResult;
  if(!confirm('確定要扣除本次帶多結果？\n已分配到的數量會從喊單中扣除（數量減少或移除），庫存也會相應減少。'))return;
  upG(gid,g=>{
    for(const[nick,items]of Object.entries(alloc)){
      for(const a of items){
        if(a.got<=0)continue;
        let toDeduct=a.got;
        for(const o of g.orders){
          if(o.nick===nick&&o.item===a.item&&toDeduct>0){
            const take=Math.min(o.qty,toDeduct);
            o.qty-=take;toDeduct-=take;
          }
        }
        g.orders=g.orders.filter(o=>o.qty>0);
        const it=(g.items||[]).find(i=>i.name===a.item);
        if(it&&it.stock) it.stock=Math.max(0,it.stock-a.got);
      }
    }
  });
  _lastPrioResult=null;
  render();
}

  html+='</table>';

  const file=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">

      });
    }
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${g.name}.csv`;a.click();return;
  }
  const byB={};for(const o of getConfirmedOrders(g)){if(!byB[o.nick])byB[o.nick]=[];byB[o.nick].push(o);}
  let text=`=== ${g.name} (${getTypes()[g.type]?.label||''}) ===\n\n`;
  for(const[nick,ords]of Object.entries(byB)){
    text+=`【${nick}】\n`;let total=0;
    for(const o of ords){const pr=effPrice(g,o);const sub=o.qty*pr;text+=`  ${o.item} x${o.qty}`;if(pr)text+=` @$${pr} = $${sub}`;if(o.note)text+=` (${o.note})`;text+='\n';total+=sub;}
    if(total)text+=`  小計：$${total}\n`;text+='\n';

function refreshPriceInputs(existing,sourceMode){

}
function priceDiff(){
  const ta=$('#bpC');if(!ta)return 0;
  const contents=ta.value.trim().split(/[\n\/,，]/).map(s=>s.trim()).filter(Boolean);
  let total=0;
  for(const c of contents){const el=$('#ip_'+CSS.escape(c));total+=parseFloat(el?.value)||0;}
  return total;
}
function updatePriceSummary(){
  const box=$('#priceSummary');if(!box)return;
  if(currentBpPriceMode()!=='adjust'){box.style.display='none';return;}
  const ta=$('#bpC');if(!ta)return;
  const contents=ta.value.trim().split(/[\n\/,，]/).map(s=>s.trim()).filter(Boolean);
  if(!contents.length){box.style.display='none';return;}
  const diff=priceDiff();
  box.style.display='block';
  box.innerHTML=Math.abs(diff)<0.01?'<span style="color:#3b6d11">合計 ±0</span>':`<span style="color:#a32d2d">合計 ${diff>0?'+':''}$${Math.round(diff)}（需為 ±0 才能儲存）</span>`;
}
function getBoxItemPrice(g,itemName){
  for(const p of (g.boxProducts||[])){
    if(bpHasItemPrices(p)&&p.contents.includes(itemName)&&p.itemPrices[itemName]!=null)return p.itemPrices[itemName];
  }
  return null;
}
function lookupPrice(g,itemName,bpId){
  if(!itemName)return null;
  if(g.type==='carry'){const it=(g.items||[]).find(i=>i.name===itemName);if(it&&it.price)return it.price;}
  if(g.type==='box'){
    if(bpId){
      const p=(g.boxProducts||[]).find(b=>b.id===bpId);
      if(p){
        if(p.kind==='single')return p.unitPrice||null;
        return bpFinalItemPrice(p,itemName);
      }
    }
    for(const p of(g.boxProducts||[])){if(p.kind==='single'&&p.contents.includes(itemName)&&p.unitPrice)return p.unitPrice;}
    const ap=getBoxItemPrice(g,itemName);if(ap!=null)return ap;
    for(const p of(g.boxProducts||[])){if(p.kind!=='single'&&p.contents.includes(itemName)&&p.avgPrice)return p.avgPrice;}
  }
  return null;
}
function effPrice(g,o){
  if(g.type==='basic'||o.rowPrice)return o.price||0;
  const p=lookupPrice(g,o.item,o.bpId);
  return p!=null?p:(o.price||0);
}
function fmtTs(ts){
  if(!ts)return '-';
  const d=new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function orderMatches(p,o){
  return o.bpId?o.bpId===p.id:p.contents.includes(o.item);
}
function bpItemLabel(bp,item){
  if(!bp)return item;
  if(bp.contents.length===1&&bp.contents[0]===bp.name)return bp.name;
  return `${bp.name}-${item}`;
}
function productSlotPrice(g,p,slot){
  const key=slot.boxIdx+'|||'+slot.item;
  const custom=Number.isFinite(slot.boxIdx)&&Object.prototype.hasOwnProperty.call(p.rowPrices||{},key);
  const price=custom?Math.max(0,Number(p.rowPrices[key])||0):(lookupPrice(g,slot.item,p.id)||0);
  return {price,custom};
}
function aggregateProductSlots(g,p,slots){
  const agg=new Map();
  for(const s of slots){
    if(!s||!s.buyer)continue;
    const priced=productSlotPrice(g,p,s);
    const key=JSON.stringify([s.buyer.nick,s.item,!!s.buyer.bind,priced.price,priced.custom]);
    agg.set(key,(agg.get(key)||0)+1);
  }
  return [...agg.entries()].map(([key,qty])=>{
    const[nick,item,bind,price,rowPrice]=JSON.parse(key);
    return {nick,item,qty,price,note:bind?'綁':'',bpId:p.id,bind,rowPrice};
  });
}
function getRegularProductConfirmedOrders(g,p){
  const info=calcBoxes(g,p),slots=[];
  info.boxes.forEach((box,boxIdx)=>{
    if(box.status==='未成團')return;
    for(const slot of box)if(slot.buyer)slots.push({...slot,boxIdx});
  });
  return aggregateProductSlots(g,p,slots);
}
function resolveBlindProductSlots(g,p){
  const info=calcBoxes(g,{...p,maxBoxes:0}),selected=[];
  for(const item of p.contents){
    const limit=Math.max(0,parseInt((p.blindCounts||{})[item])||0);
    if(!limit)continue;
    const queue=info.boxes.map((box,boxIdx)=>{
      const slot=box.find(s=>s.item===item);
      return slot&&slot.buyer?{...slot,boxIdx}:null;
    }).filter(Boolean);
    const used=new Set(),itemSlots=[];
    for(const pin of((p.blindAllocPins||{})[item]||[])){
      if(itemSlots.length>=limit)break;
      const idx=queue.findIndex((slot,i)=>!used.has(i)&&(pin.oid?slot.buyer.oid===pin.oid&&slot.buyer.bind===!!pin.bind:slot.buyer.nick===pin.nick&&slot.buyer.bind===!!pin.bind));
      if(idx>=0){used.add(idx);itemSlots.push(queue[idx]);}
    }
    for(let i=0;i<queue.length&&itemSlots.length<limit;i++){
      if(!used.has(i)){used.add(i);itemSlots.push(queue[i]);}
    }
    selected.push(...itemSlots);
  }
  return selected;
}
function stabilizeBlindAllocation(g,p){
  if(p.kind!=='blind'||!p.blindOpened)return;
  const pins={};
  for(const slot of resolveBlindProductSlots(g,p)){
    (pins[slot.item]=pins[slot.item]||[]).push({nick:slot.buyer.nick,bind:!!slot.buyer.bind,oid:slot.buyer.oid||0});
  }
  p.blindAllocPins=pins;
}
function getBlindProductConfirmedOrders(g,p){
  if(!p.blindOpened)return getRegularProductConfirmedOrders(g,p);
  return aggregateProductSlots(g,p,resolveBlindProductSlots(g,p));
}
function getBlindAdjustmentMap(g){
  const result={};
  const add=(nick,amount)=>{
    if(!result[nick])result[nick]=0;
    result[nick]+=amount;
  };
  for(const p of(g.boxProducts||[])){
    if(p.kind!=='blind'||!p.blindOpened)continue;
    const baseline=Array.isArray(p.blindBaseline)?p.blindBaseline:getRegularProductConfirmedOrders(g,p);
    const actual=getBlindProductConfirmedOrders(g,p);
    for(const o of baseline)add(o.nick,-o.qty*effPrice(g,o));
    for(const o of actual)add(o.nick,o.qty*effPrice(g,o));
  }
  for(const nick of Object.keys(result))result[nick]=Math.round(result[nick]*100)/100;
  return result;
}
function getConfirmedOrders(g){
  if(g.type!=='box'||!(g.boxProducts||[]).length)return g.orders;
  const res=[];const covered=new Set();
  for(const p of g.boxProducts){
    if(p.kind==='single'){
      for(const o of g.orders){if(p.contents.includes(o.item)&&orderMatches(p,o)){res.push(o);covered.add(o.id);}}
      continue;
    }
    for(const o of g.orders){if(p.contents.includes(o.item)&&orderMatches(p,o))covered.add(o.id);}
    res.push(...(p.kind==='blind'&&p.blindOpened?getBlindProductConfirmedOrders(g,p):getRegularProductConfirmedOrders(g,p)));
  }
  for(const o of g.orders){if(!covered.has(o.id))res.push(o);}
  return res;
}

function normText(s){
  let i=0;const nums=[];
  const tpl=s.replace(/[\d][\d,.]*/g,m=>{nums.push(m);return `{${++i}}`;});
  return{tpl,nums};
}
function loadTextOv(){
  if(RO)return window.VIEWER_TEXTOV||{};
  return JSON.parse(localStorage.getItem('gp_text_overrides')||'{}');
}
function applyTextOverrides(){
  const map=loadTextOv();
  if(!Object.keys(map).length)return;
  for(const rootId of['app','modalContent']){
    const root=document.getElementById(rootId);if(!root)continue;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    for(const n of nodes){
      const s=n.nodeValue;if(!s||!s.trim())continue;
      const{tpl,nums}=normText(s);
      const ov=map[tpl];if(!ov||ov===tpl)continue;
      n.nodeValue=ov.replace(/\{(\d+)\}/g,(m,i)=>nums[i-1]!==undefined?nums[i-1]:m);
    }
  }
}

function editElementText(el){
  const tns=[...el.childNodes].filter(n=>n.nodeType===3&&n.nodeValue.trim());
  if(!tns.length)return;
  const full=tns.map(n=>n.nodeValue).join('');
  const{tpl}=normText(full);
  const map=loadTextOv();
  let key=tpl;
  for(const[k,v]of Object.entries(map)){if(v===tpl){key=k;break;}}
  const cur=map[key]||tpl;
  const input=prompt('修改文字（{1}、{2} 等代表會變動的數字，請保留）：',cur);
  if(input===null)return;
  const val=input.trim();
  if(!val||val===key)delete map[key];
  else map[key]=val;
  localStorage.setItem('gp_text_overrides',JSON.stringify(map));
  render();
}
document.addEventListener('click',e=>{
  if(!_editMode)return;
  if(e.target.closest('#editTextBtn'))return;
  e.preventDefault();e.stopPropagation();
  editElementText(e.target);
},true);
(function(){
  const restoreBtn=document.createElement('button');
  restoreBtn.id='hiddenStatsBtn';
  restoreBtn.textContent='復原統計';
  restoreBtn.style.cssText='display:none;position:fixed;left:16px;bottom:16px;z-index:998;padding:8px 14px;border:1px solid #f0d7e2;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.12)';
  restoreBtn.onclick=showHiddenStatsModal;
  document.body.appendChild(restoreBtn);
  const btn=document.createElement('button');
  btn.id='editTextBtn';
  btn.textContent='✏ 修改頁面內容';
  btn.style.cssText='position:fixed;right:16px;bottom:16px;z-index:998;padding:8px 14px;border:1px solid #f0d7e2;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.12)';
  btn.onclick=toggleEditMode;
  document.body.appendChild(btn);
})();
function stripEditUI(){
  if(!RO)return;
  const ok=/^\s*(goGroup|goHome|homeFilter|toggleHomeSearch|homeSearch=|tab='|toggleBpDetail|showImg|event\.stopPropagation\(\);(showImg|openOfficialUrl)|closeModal|showShipModal|_sp(Nick|Gid|Hide)|doExport|exportXls|exportSummaryXls|if\(event\.target)/;
  document.querySelectorAll('[onclick]').forEach(el=>{
    const oc=el.getAttribute('onclick')||'';
    if(ok.test(oc))return;
    if(el.tagName==='BUTTON')el.remove();
    else{el.removeAttribute('onclick');el.style.cursor='default';el.title='';}
  });
}

const _renderCore=render;
render=function(){_renderCore();applyTextOverrides();stripEditUI();};
const _openModalCore=openModal;
openModal=function(html){_openModalCore(html);applyTextOverrides();stripEditUI();};

if(RO){
  document.body.classList.add('ro');
  const s=document.createElement('style');
  s.textContent='body.ro .slot-del{display:none!important}body.ro .gear-btn{display:none!important}body.ro #editTextBtn{display:none!important}body.ro .slot-empty{cursor:default!important}body.ro .slot-empty:hover{background:#fdf1f6!important}';
  document.head.appendChild(s);
}
render();applyTheme();
</script>
