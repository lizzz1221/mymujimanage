<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿伯一次買購</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--accent:#c9899f;--accent-soft:#f6e9ee;--sky:#e5b85f;--sky-soft:#fff8e6;--line:#ead9e0;--ink:#5c4a52;--ink-soft:#a08b94;--paper:#fff;--cream:#f9eff3;--fs:13px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Huninn','Yuanti TC','Microsoft JhengHei',sans-serif;background:#fbf6f8;color:var(--ink);line-height:1.6;font-size:var(--fs)}
@media(min-width:800px){body{font-size:calc(var(--fs) + 2px)}}
.app{max-width:1020px;margin:0 auto;padding:1rem}
h1{font-size:21px;font-weight:500;text-align:center;margin-bottom:1rem;color:var(--accent)}
h2{font-size:18px;font-weight:500;margin-bottom:.75rem}
h3{font-size:15px;font-weight:500;margin-bottom:.5rem}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(201,137,159,.07)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:8px}

label{display:block;font-size:.95em;color:var(--ink-soft);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font-size:.95em;background:#fff;color:var(--ink);outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,137,159,.14)}
textarea{resize:vertical;min-height:60px;line-height:1.7}

.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.form-group{display:flex;flex-direction:column}

button{padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;font-size:.95em;transition:all .12s;white-space:nowrap;font-family:inherit}
button:hover{background:var(--cream);border-color:var(--accent)}
button:active{transform:scale(.96)}
.bp{background:var(--accent);color:#fff;border-color:var(--accent)}
.bp:hover{background:#b87a90;border-color:#b87a90}
.bd{color:#b96e7c;border-color:#e8c3cc}
.bd:hover{background:#f9edf0}
.bs{padding:3px 8px;font-size:.88em}
.bg{border:none;background:none;color:var(--accent);padding:2px 6px}
.bg:hover{background:var(--accent-soft);border-radius:8px}
.btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:.92em}
th{text-align:center;padding:6px 8px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-weight:500;color:#a8798c;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #f6ecf0;vertical-align:middle;text-align:center;white-space:nowrap}
tr:hover td{background:#fbf5f7}
td input,td select{padding:4px 6px;font-size:.95em;border-radius:6px}

.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.85em;font-weight:500;white-space:nowrap}
.b-blue{background:var(--sky-soft);color:#b5812e}
.b-green{background:#e2f5e6;color:#4e9a63}
.b-amber{background:#fdf0dc;color:#c08a3e}
.b-red{background:#fde5ea;color:#d16277}
.b-purple{background:#ece7fa;color:#8a75c9}
.b-gray{background:#f4eef1;color:#a58a95}
.b-teal{background:#dff4ef;color:#3e9e88}
.b-coral{background:#fdeae2;color:#d07a55}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1rem}
.stat{background:var(--cream);border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.stat:nth-child(2){background:var(--sky-soft);border-color:#f2dfaa}
.stat-l{font-size:12px;color:var(--ink-soft)}
.stat-v{font-size:22px;font-weight:500;color:var(--accent)}
.stat:nth-child(2) .stat-v{color:#b5812e}

.empty{text-align:center;color:var(--ink-soft);padding:1.5rem;font-size:13px}
.muted{color:var(--ink-soft);font-size:.9em}

.nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.nav-crumb{font-size:13px;color:var(--ink-soft);cursor:pointer}
.nav-crumb:hover{color:var(--accent)}
.nav-title{font-size:16px;font-weight:500}
.group-hero{margin-bottom:1rem;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper);box-shadow:0 2px 8px rgba(201,137,159,.07)}
.group-hero-cover{width:100%;height:230px;object-fit:cover;display:block;background:var(--sky-soft)}
.group-hero-ph{height:120px;background:var(--sky-soft)}
.group-hero-main{padding:14px 16px}
.group-hero-title{font-size:26px;font-weight:700;line-height:1.25;color:var(--ink);margin-right:8px}
.group-hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.group-note{margin-top:10px;padding:7px 10px;background:#fdf1f6;border-left:3px solid var(--sky);border-radius:8px;color:var(--ink-soft);font-size:.9em}

.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.group-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(201,137,159,.07);display:flex;flex-direction:column}
.group-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(201,137,159,.15);transform:translateY(-2px)}
.gc-cover{width:100%;height:130px;object-fit:cover;display:block;background:var(--cream)}
.gc-ph{background:var(--sky-soft);position:relative}
.gc-ph:after{content:'';width:42px;height:42px;border-radius:12px;border:2px solid rgba(201,137,159,.35);box-shadow:16px 12px 0 rgba(229,184,95,.28)}
.gc-body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.group-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.group-card .name{font-size:1em;font-weight:500;line-height:1.35}
.group-card .meta{display:flex;gap:6px 10px;font-size:.85em;color:var(--ink-soft);flex-wrap:wrap;margin-top:auto}

.tabs{display:flex;gap:2px;margin-bottom:1rem;border-bottom:2px solid var(--accent-soft);flex-wrap:wrap}
.tab{padding:6px 14px;cursor:pointer;border:none;background:none;font-size:.95em;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:10px 10px 0 0}
.tab:hover{color:var(--ink);background:var(--cream)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(92,74,82,.35);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:1.5rem;max-width:560px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(201,137,159,.18)}

.cb{display:flex;align-items:center;gap:6px;margin:6px 0}
.cb input[type=checkbox]{width:auto}
.cb label{margin:0;font-size:13px;color:var(--ink)}

.search-bar{margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-bar select{width:auto;min-width:100px;flex:1}

.export-box{font-family:Consolas,monospace;font-size:11px;white-space:pre;background:var(--cream);padding:.75rem;border-radius:10px;overflow:auto;max-height:300px;margin-top:8px}

.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

.filter-chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:3px 12px;border-radius:14px;font-size:.9em;cursor:pointer;border:1px solid var(--line);background:#fff}
.chip:hover{background:var(--cream);border-color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.gear-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;font-size:18px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;border-radius:10px;padding:0}
.gear-btn:hover{background:var(--accent-soft);color:var(--ink)}

.search-wrap{display:flex;align-items:center;gap:2px;background:#fff;border-radius:16px;border:1px solid transparent;transition:all .25s}
.search-wrap input{width:0;opacity:0;padding:0;border:none;background:none;transition:all .25s;font-size:.95em}
.search-wrap input:focus{box-shadow:none}
.search-wrap.open{border-color:var(--accent);box-shadow:0 2px 8px rgba(201,137,159,.15);padding-left:10px}
.search-wrap.open input{width:150px;opacity:1;padding:6px 4px}

.settings-section{margin-bottom:20px}
.settings-section h3{border-bottom:1px solid var(--accent-soft);padding-bottom:6px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #fdf1f6;gap:10px;flex-wrap:wrap}
.setting-label{font-size:13px;color:var(--ink);flex:1;min-width:100px}
.setting-sub{font-size:11px;color:var(--ink-soft)}
.setting-control{min-width:120px}
.setting-control input,.setting-control select{width:100%;font-size:13px}
.setting-control input[type=checkbox]{width:auto}
.color-row{display:flex;gap:6px;align-items:center}
.color-row input[type=color]{width:36px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer}

.bp-detail{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.bp-detail-img{width:140px;max-width:30%;border-radius:12px;border:1px solid var(--line);flex-shrink:0;cursor:zoom-in}
.twisty{width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:7px solid #888780;display:inline-block;transition:transform .12s;flex-shrink:0}
.twisty.open{transform:rotate(90deg)}
@media(max-width:640px){
  .bp-detail{flex-direction:column;align-items:center}
  .bp-detail-img{width:180px;max-width:70%}
  .bp-detail>div{width:100%}
}

td .slot-del{display:none;color:#d16277;cursor:pointer;margin-left:4px;font-weight:bold}
td:hover .slot-del{display:inline}
.slot-empty{cursor:pointer}
.slot-empty:hover{background:#f6dfe9!important}

.progress-bar{height:8px;background:var(--cream);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}

.box-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin:8px 0}
.box-cell{text-align:center;padding:6px 4px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.box-cell.full{background:#e2f5e6;border-color:#a5d9b2;color:#4e9a63}
.box-cell.empty{background:#fde5ea;border-color:#f3b8c4;color:#d16277}
.box-cell.partial{background:#fdf0dc;border-color:#f2d5a4;color:#c08a3e}

.box-product{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.box-product-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}

.box-instance{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fef7fa}
.box-instance-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

.price-grid{display:grid;grid-template-columns:1fr 100px;gap:4px 10px;align-items:center;margin:8px 0;font-size:13px}
.price-grid label{margin:0;font-size:13px}
.price-grid input{width:100px}
.price-summary{font-size:12px;padding:8px 10px;background:#fdf1f6;border-radius:6px;margin-top:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script>document.write('<script src="data.js'+(location.protocol==='file:'?'':'?v='+Date.now())+'"><\/script>');</script>
<script>
const $=s=>document.querySelector(s);
const RO=!!window.VIEWER_DB;

const DEFAULT_SETTINGS={
  accentColor:'#c9899f',
  fontSize:13,
  appTitle:'阿伯一次買購',
  fieldNick:'暱稱',
  fieldItem:'商品',
  fieldQty:'數量',
  fieldPrice:'單價',
  fieldSeries:'系列',
  fieldNote:'備註',
  showSeries:false,
  showNote:true,
  showPrice:true,
  defaultType:'basic',
  defaultStatus:'進行中',
  statuses:'進行中,已截團待收款,收款中,已完成收款,已到貨,已結團',
  typeCarryLabel:'帶多統計',
  typeCarryDesc:'社團售物，帶越多越優先',
  typeBoxLabel:'拆盒',
  typeBoxDesc:'拆盒分款，湊滿一盒的內容物才成團',
  typeBasicLabel:'一般代購',
  typeBasicDesc:'單純統計訂單數量金額',
};
function loadSettings(){
  if(RO)return{...DEFAULT_SETTINGS,...(window.VIEWER_SETTINGS||{})};
  const s=JSON.parse(localStorage.getItem('gp_settings')||'{}');
  if((s.accentColor==='#185fa5'||s.accentColor==='#e07a9e')&&!localStorage.getItem('gp_accent_mig2')){
    s.accentColor='#c9899f';
    localStorage.setItem('gp_settings',JSON.stringify(s));
    localStorage.setItem('gp_accent_mig2','1');
  }
  if(s.appTitle==='社團周邊代購管理'&&!localStorage.getItem('gp_title_mig')){
    s.appTitle='阿伯一次買購';
    localStorage.setItem('gp_settings',JSON.stringify(s));
    localStorage.setItem('gp_title_mig','1');
  }
  if(!localStorage.getItem('gp_status_mig2')){
    if(s.statuses){
      const drop=['開團中','已截單','已封存'];
      const list=s.statuses.split(',').map(x=>x.trim()).filter(x=>x&&!drop.includes(x));
      for(const add of['進行中','收款中','已到貨','已結團'])if(!list.includes(add))list.push(add);
      s.statuses=list.join(',');
    }
    if(s.defaultStatus==='開團中')s.defaultStatus='進行中';
    localStorage.setItem('gp_settings',JSON.stringify(s));
    localStorage.setItem('gp_status_mig2','1');
  }
  if(!localStorage.getItem('gp_status_mig3')){
    if(s.statuses){
      const list=s.statuses.split(',').map(x=>x.trim()).filter(Boolean);
      if(!list.includes('已完成收款')){
        const i=list.indexOf('收款中');
        list.splice(i>=0?i+1:list.length,0,'已完成收款');
        s.statuses=list.join(',');
        localStorage.setItem('gp_settings',JSON.stringify(s));
      }
    }
    localStorage.setItem('gp_status_mig3','1');
  }
  if(!localStorage.getItem('gp_status_mig4')){
    if(s.statuses){
      const list=s.statuses.split(',').map(x=>x.trim()).filter(Boolean);
      if(!list.includes('已截團待收款')){
        const i=list.indexOf('進行中');
        list.splice(i>=0?i+1:list.length,0,'已截團待收款');
        s.statuses=list.join(',');
        localStorage.setItem('gp_settings',JSON.stringify(s));
      }
    }
    localStorage.setItem('gp_status_mig4','1');
  }
  return {...DEFAULT_SETTINGS,...s};
}
function saveSetting(key,val){
  const s=loadSettings();s[key]=val;
  localStorage.setItem('gp_settings',JSON.stringify(s));
}
function saveAllSettings(obj){
  const s=loadSettings();Object.assign(s,obj);
  localStorage.setItem('gp_settings',JSON.stringify(s));
}
function resetSettings(){
  localStorage.removeItem('gp_settings');
}
function S(){return loadSettings();}

function getTypes(){
  const s=S();
  return {
    carry:{label:s.typeCarryLabel,badge:'b-purple',desc:s.typeCarryDesc},
    box:{label:s.typeBoxLabel,badge:'b-coral',desc:s.typeBoxDesc},
    basic:{label:s.typeBasicLabel,badge:'b-blue',desc:s.typeBasicDesc},
  };
}
function getStatuses(){return S().statuses.split(',').map(s=>s.trim()).filter(Boolean);}
function getSB(){
  const colors=['b-green','b-amber','b-blue','b-purple','b-gray','b-teal','b-coral','b-red'];
  const st=getStatuses();const m={};
  st.forEach((s,i)=>{m[s]=colors[i%colors.length];});
  return m;
}
function applyTheme(){
  const s=S();
  document.title=s.appTitle;
  document.documentElement.style.setProperty('--accent',s.accentColor);
  document.documentElement.style.setProperty('--fs',s.fontSize+'px');
  document.querySelectorAll('.bp').forEach(el=>{el.style.background=s.accentColor;el.style.borderColor=s.accentColor;});
  document.querySelectorAll('.tab.active').forEach(el=>{el.style.color=s.accentColor;el.style.borderBottomColor=s.accentColor;});
}

function localDateValue(ts){
  const d=new Date(Number(ts)||Date.now());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function localDateTimeValue(ts){
  const d=new Date(Number(ts)||Date.now()),pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function groupOpenedAt(g){
  const m=String(g.createdAt||'').match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).getTime():0;
}
function inferMemberJoinedAt(db,nick){
  const times=(db.groups||[]).filter(g=>(g.orders||[]).some(o=>o.nick===nick)).map(groupOpenedAt).filter(Boolean);
  return times.length?Math.min(...times):Date.now();
}
function releaseLegacyBindLocks(db){
  let changed=false;
  for(const g of db?.groups||[]){
    for(const o of g.orders||[]){
      if(o.bind&&o.autoBind==null){o.autoBind=true;changed=true;}
      if(o.bindLift){o.lift=true;delete o.bindLift;changed=true;}
    }
    for(const p of g.boxProducts||[]){
      const frozen=p.frozenPins;if(!frozen)continue;
      const releaseRows=new Set();
      for(const[key,pin]of Object.entries(frozen)){
        if(pin&&typeof pin==='object'&&(pin.empty||pin.bind))releaseRows.add(parseInt(key.split('|||')[0]));
      }
      if(!releaseRows.size)continue;
      for(const key of Object.keys(frozen))if(releaseRows.has(parseInt(key.split('|||')[0])))delete frozen[key];
      changed=true;
    }
  }
  return changed;
}
let _vdb=null;
function loadDB(){
  if(RO){if(!_vdb){_vdb=window.VIEWER_DB;releaseLegacyBindLocks(_vdb);}return _vdb;}
  const db=JSON.parse(localStorage.getItem('gp_db2')||'{"groups":[],"nid":1}');
  let changed=releaseLegacyBindLocks(db);
  const statusMap={'開團中':'進行中','已截單':'收款中','已封存':'已結團'};
  for(const g of db.groups){
    if(statusMap[g.status]){g.status=statusMap[g.status];changed=true;}
    if(g.deadline&&g.status==='進行中'&&new Date(g.deadline)<new Date()){g.status='已截團待收款';changed=true;}
    // 既有的已到貨團補上到貨時間（囤貨期限起算點，可在團內設定校正）
    if(['已到貨','已結團'].includes(g.status)&&!g.arrivedAt){g.arrivedAt=Date.now();changed=true;}
  }
  if(!db.buyers)db.buyers={};
  for(const n of Object.keys(db.buyers)){
    const b=db.buyers[n];
    if(b&&b.contact&&/^https?:\/\//.test(b.contact)&&!b.url){b.url=b.contact;b.contact='';changed=true;}
  }
  if(!db.fixedTeam)db.fixedTeam={};
  if(!db.teamNotes)db.teamNotes={};
  if(!db.teamJoinedAt)db.teamJoinedAt={};
  if(!db.units)db.units=[]; // 團體庫：{id,name,icon}
  if(!db.roles)db.roles=[]; // 固位角色清單
  if(!db.roleUnits)db.roleUnits={}; // 角色所屬團體：{角色名稱:團體id}
  for(const g of db.groups){
    if(g.fixedTeam){
      for(const[nick,slots]of Object.entries(g.fixedTeam)){
        if(!db.fixedTeam[nick])db.fixedTeam[nick]=slots;
      }
      delete g.fixedTeam;changed=true;
    }
  }
  for(const nick of Object.keys(db.fixedTeam||{})){
    if(!Number.isFinite(Number(db.teamJoinedAt[nick]))){
      db.teamJoinedAt[nick]=inferMemberJoinedAt(db,nick);changed=true;
    }
  }
  const knownRoles=new Set(db.roles);
  for(const slots of Object.values(db.fixedTeam||{})){
    for(const role of Object.keys(slots||{})){
      if(!knownRoles.has(role)){db.roles.push(role);knownRoles.add(role);changed=true;}
    }
  }  for(const g of db.groups){
    if(g.type==='box'&&(g.boxProducts||[]).length){
      for(const o of g.orders){
        if(o.bpId==null){
          const bp=g.boxProducts.find(p=>p.contents.includes(o.item));
          if(bp){o.bpId=bp.id;changed=true;}
        }
      }
    }
  }
  if(changed)localStorage.setItem('gp_db2',JSON.stringify(db));
  return db;
}
function saveDB(db){if(RO)return;localStorage.setItem('gp_db2',JSON.stringify(db));}
function getG(id){return loadDB().groups.find(g=>g.id===id);}
function upG(id,fn){
  const db=loadDB();const g=db.groups.find(g=>g.id===id);
  if(g){stabilizeConfirmedBoxes(g);fn(g);stabilizeConfirmedBoxes(g);saveDB(db);}
}

let view='home',gid=null,tab='orders',sNick='',sItem='',homeFilter='';
function goHome(){view='home';gid=null;render();}
function goGroup(id){view='group';gid=id;tab='orders';sNick='';sItem='';render();}
function render(){view==='home'?renderHome():renderGroup();}
function syncHiddenStatsBtn(){
  const btn=document.getElementById('hiddenStatsBtn');
  if(!btn)return;
  const g=(view==='group'&&tab==='buyers')?getG(gid):null;
  const count=g?(g.hiddenStatsNicks||[]).length:0;
  btn.style.display=(!RO&&count)?'block':'none';
  btn.textContent=count?`復原統計 (${count})`:'復原統計';
}

let homeSearch='',homeSearchOpen=false;
function toggleHomeSearch(){
  homeSearchOpen=!homeSearchOpen;
  if(!homeSearchOpen)homeSearch='';
  render();
}
function renderHome(){
  const db=loadDB();
  let groups=db.groups;
  if(homeFilter){const _st=getStatuses();if(_st.includes(homeFilter))groups=groups.filter(g=>g.status===homeFilter);else groups=groups.filter(g=>g.type===homeFilter);}
  if(homeSearch.trim()){
    const q=homeSearch.trim().toLowerCase();
    groups=groups.filter(g=>{
      if((g.name||'').toLowerCase().includes(q))return true;
      const styles=(g.boxProducts||[]).flatMap(p=>[p.name,...(p.contents||[])]);
      const carryItems=(g.items||[]).map(i=>i.name);
      return [...styles,...carryItems].some(s=>(s||'').toLowerCase().includes(q));
    });
  }
  const active=groups.filter(g=>g.status!=='已封存');
  const archived=groups.filter(g=>g.status==='已封存');

  const TYPES=getTypes();const st=S();
  const searchIcon='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>';
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${RO?'.3rem':'1rem'};gap:6px">
    <h1 style="margin:0">${esc(st.appTitle)}</h1>
    <div style="flex:1"></div>
    <div class="search-wrap ${homeSearchOpen?'open':''}">
      <input id="homeSearchInput" placeholder="搜尋團名…" value="${esc(homeSearch)}" onkeydown="if(event.key==='Enter'){homeSearch=this.value;render();}">
      ${homeSearchOpen?`<button class="gear-btn" onclick="homeSearch=document.getElementById('homeSearchInput').value;render()" title="搜尋">${searchIcon}</button>`:''}
      <button class="gear-btn" onclick="toggleHomeSearch()" title="${homeSearchOpen?'關閉搜尋':'搜尋團名'}">${homeSearchOpen?'✕':searchIcon}</button>
    </div>
    <button class="gear-btn" onclick="showSettings()" title="設定">⚙</button></div>
    ${RO&&window.VIEWER_DB.publishedAt?`<div class="muted" style="margin-bottom:1rem">資料更新時間：${esc(window.VIEWER_DB.publishedAt)}</div>`:''}
    <div class="toolbar"><button class="bp" onclick="showNewGroupModal()">建立新團</button><button onclick="showFixedTeamModal()">固團成員</button><button onclick="showUnitsModal()">團體管理</button><button onclick="showShipModal()">個人貨況查詢</button><button onclick="showGithubSyncModal()">GitHub 同步</button><button onclick="document.getElementById('importDataFile').click()">匯入 data.js</button><input id="importDataFile" type="file" accept=".js,.txt" style="display:none" onchange="importViewerData(this)"><button onclick="exportViewerData()">發布查詢資料</button><span class="muted">共 ${db.groups.length} 個團</span></div>
    <div class="toolbar" style="margin-top:-4px">
      <button class="bs" onclick="exportFullBackup()" title="匯出含全部團與私人資料的完整備份，用於裝置間手動同步">📦 匯出完整備份</button>
      <button class="bs" onclick="document.getElementById('importBackupFile').click()" title="匯入完整備份，會覆蓋此裝置的所有資料">📥 匯入完整備份</button>
      <input id="importBackupFile" type="file" accept=".json" style="display:none" onchange="importFullBackup(this)">
    </div>
    <div class="filter-chips"><span class="chip ${homeFilter===''?'active':''}" onclick="homeFilter='';render()">全部</span>
    ${RO
      ?['進行中','已截團待收款','收款中','已完成收款','已到貨'].map(s=>`<span class="chip ${homeFilter===s?'active':''}" onclick="homeFilter='${s}';render()">${s}</span>`).join('')
      :[...Object.entries(TYPES).map(([k,v])=>`<span class="chip ${homeFilter===k?'active':''}" onclick="homeFilter='${k}';render()">${v.label}</span>`),
        ...['進行中','已截團待收款','收款中','已完成收款','已到貨'].map(s=>`<span class="chip ${homeFilter===s?'active':''}" onclick="homeFilter='${s}';render()">${s}</span>`)
      ].join('')}</div>`;

  const byNew=(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||b.id-a.id;
  active.sort(byNew);archived.sort(byNew);

  if(!active.length&&!archived.length) h+=`<div class="empty">還沒有團購，點「建立新團」開始</div>`;
  if(active.length){h+=`<div class="group-grid">`;for(const g of active) h+=groupCard(g);h+=`</div>`;}
  if(archived.length){h+=`<h3 style="margin-top:1.5rem;color:#888780">已封存</h3><div class="group-grid">`;for(const g of archived) h+=groupCard(g,true);h+=`</div>`;}
  $('#app').innerHTML=h;
  syncHiddenStatsBtn();
  // 搜尋展開時保持輸入焦點（重繪會失焦）
  if(homeSearchOpen){
    const inp=$('#homeSearchInput');
    if(inp){inp.focus();const L=inp.value.length;inp.setSelectionRange(L,L);}
  }
}

function groupCard(g,dim){
  const allUnits=getUnits();
  const buyers=new Set(g.orders.map(o=>o.nick)).size;
  let productCount=0;
  if(g.type==='box')productCount=(g.boxProducts||[]).length;
  else if(g.type==='carry')productCount=(g.items||[]).length;
  if(!productCount)productCount=new Set(g.orders.map(o=>o.item).filter(Boolean)).size;
  const openDate=g.createdAt||'';
  const closeDate=g.deadline?g.deadline.replace('T',' ').replace(/-/g,'/'):'';
  const T=getTypes(),SB=getSB();
  const ti=T[g.type]||T.basic;
  return `<div class="group-card" onclick="goGroup(${g.id})" style="${dim?'opacity:.6':''}">
    ${g.cover?`<img class="gc-cover" src="${g.cover}" style="object-position:${coverPos(g)}">`:`<div class="gc-cover gc-ph"></div>`}
    <div class="gc-body">
      <div class="top"><span class="name">${g.starGroup?'<span style="color:#d4a017">★</span> ':''}${esc(g.name)}</span><span class="badge ${SB[g.status]||'b-gray'}">${g.status}</span></div>
      <div><span class="badge ${ti.badge}">${ti.label}</span></div>
      <div class="meta"><span>${buyers} 人</span><span>${productCount} 種商品</span>${(g.unitIds||[]).length?`<span style="display:inline-flex;gap:3px;align-items:center">${g.unitIds.map(id=>{const u=allUnits.find(x=>x.id===id);return u?(u.icon?`<img src="${u.icon}" title="${esc(u.name)}" style="width:18px;height:18px;object-fit:cover;border-radius:4px">`:`<span title="${esc(u.name)}" style="font-size:11px;padding:1px 5px;background:var(--accent-soft);border-radius:8px">${esc(u.name)}</span>`):'';}).join('')}</span>`:''}</div>
      <div class="meta"><span>${openDate} ~ ${closeDate}</span></div>
    </div></div>`;
}

function renderGroup(){
  const g=getG(gid);if(!g){goHome();return;}
  const T=getTypes(),SBM=getSB(),st=S();
  const ti=T[g.type]||T.basic;
  const officialBtn=g.officialUrl?`<button class="bs" onclick="event.stopPropagation();openOfficialUrl('${encodeURIComponent(g.officialUrl)}')">官網/官店</button>`:'';
  let h=`<div class="nav"><span class="nav-crumb" onclick="goHome()">← 回首頁</span><div style="flex:1"></div><button class="bs" onclick="showEditGroupModal(${g.id})">編輯團</button></div>
    <div class="group-hero">
      ${g.cover?`<img class="group-hero-cover" src="${g.cover}" style="object-position:${coverPos(g)}">`:`<div class="group-hero-ph"></div>`}
      <div class="group-hero-main">
        <div><span class="group-hero-title">${esc(g.name)}</span><span class="badge ${ti.badge}">${ti.label}</span> <span class="badge ${SBM[g.status]||'b-gray'}">${g.status}</span></div>
        <div class="group-hero-meta"><span class="muted">開團 ${esc(g.createdAt||'')}</span>${g.deadline?`<span class="muted">截團 ${esc(g.deadline.replace('T',' ').replace(/-/g,'/'))}</span>`:''}${officialBtn}</div>
        ${g.desc?`<div class="group-note">${esc(g.desc)}</div>`:''}
        ${g.officialShip?`<div class="group-note">官方預計出貨時間：${esc(g.officialShip)}</div>`:''}
      </div>
    </div>`;

  const tabDefs=[
    {key:'orders',label:'喊單列表',show:true},
    {key:'boxSetup',label:'拆團狀況',show:g.type==='box'},
    {key:'single',label:'單領',show:g.type==='box'},
    {key:'items',label:'商品庫存',show:g.type==='carry'},
    {key:'priority',label:'帶多計算',show:g.type==='carry'},
    {key:'buyers',label:'已成團統計',show:true},
    {key:'pay',label:'收款狀況',show:true},
    {key:'groupSettings',label:'團內設定',show:!RO},
    {key:'export',label:'匯出',show:!RO},
  ];
  const vis=tabDefs.filter(t=>t.show);
  if(!vis.find(t=>t.key===tab))tab='orders';
  h+=`<div class="tabs">${vis.map(t=>`<button class="tab ${tab===t.key?'active':''}" onclick="tab='${t.key}';render()">${t.label}</button>`).join('')}</div>`;

  const renderers={orders:renderOrdersTab,boxSetup:renderBoxSetupTab,single:renderSingleTab,items:renderItemsTab,priority:renderPriorityTab,buyers:renderBuyersTab,pay:renderPayTab,groupSettings:renderGroupSettingsTab,export:renderExportTab};
  h+=(renderers[tab]||renderers.orders)(g);
  $('#app').innerHTML=h;
  syncHiddenStatsBtn();
}

function renderOrdersTab(g){
  const st=S();
  const _team=getTeam();
  const nicks=[...new Set(g.orders.map(o=>o.nick))].sort();
  const items=[...new Set(g.orders.map(o=>o.item))].sort();
  const isBox=g.type==='box';
  const confirmed=getConfirmedOrders(g);
  const buyers=new Set(confirmed.map(o=>o.nick)).size;
  const totalQty=confirmed.reduce((s,o)=>s+o.qty,0);
  const totalAmt=confirmed.reduce((s,o)=>s+o.qty*effPrice(g,o),0);

  let h=RO?'':`<div class="card"><h3>新增喊單</h3>
    <p class="muted" style="margin-bottom:8px">批次：${st.fieldNick} / ${isBox?'款式':st.fieldItem} / ${st.fieldQty}${isBox?'':' / '+st.fieldPrice}（每行一筆）</p>
    <textarea id="bulkIn" placeholder="${isBox?'小明 / 角色A / 1\n小花 / 角色B / 2\n阿杰 / 角色A / 3':'小明 / 立牌A / 2 / 150\n小花 / 吊飾B / 3 / 80'}" rows="4"></textarea>
    <div class="btn-row"><button class="bp" onclick="bulkAdd(${g.id})">批次匯入</button>
    <button onclick="showSingleOrderModal(${g.id})">單筆新增</button></div></div>`;

  h+=`<div class="card"><div class="card-header"><h3 style="margin:0">已成團統計</h3></div>
    <div class="stats" style="margin-bottom:0">
      <div class="stat"><div class="stat-l">喊單人數</div><div class="stat-v">${buyers}</div></div>
      <div class="stat"><div class="stat-l">總件數</div><div class="stat-v">${totalQty}</div></div>
      <div class="stat"><div class="stat-l">總金額</div><div class="stat-v">$${totalAmt.toLocaleString()}</div></div>
    </div></div>`;

  h+=`<div class="card"><div class="card-header"><h3 style="margin:0">喊單列表 (${g.orders.length})</h3>
    <button class="bs bd" onclick="clearOrders(${g.id})">清除全部</button></div>`;
  let itemFilterHtml;
  const bps=g.boxProducts||[];
  if(isBox&&bps.length){
    itemFilterHtml=`<select onchange="sItem=this.value;render()"><option value="">全部${esc(st.fieldItem)}</option>`+
      bps.map(p=>`<optgroup label="${esc(p.name)}">
        <option value="bp:${p.id}" ${sItem==='bp:'+p.id?'selected':''}>${esc(p.name)}（全部）</option>
        ${p.contents.map(c=>{const v=p.id+'|||'+c;return `<option value="${esc(v)}" ${sItem===v?'selected':''}>${esc(c)}</option>`;}).join('')}
      </optgroup>`).join('')+`</select>`;
  } else {
    itemFilterHtml=`<select onchange="sItem=this.value;render()"><option value="">全部${esc(st.fieldItem)}</option>${items.map(n=>`<option value="${esc(n)}" ${sItem===n?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  }
  h+=`<div class="search-bar">
    ${itemFilterHtml}
    <select onchange="sNick=this.value;render()"><option value="">全部${esc(st.fieldNick)}</option>${nicks.map(n=>`<option value="${esc(n)}" ${sNick===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;

  let filtered=[...g.orders].sort((a,b)=>boxOrderTime(a)-boxOrderTime(b)||(a.id||0)-(b.id||0));
  if(sNick) filtered=filtered.filter(o=>o.nick===sNick);
  if(sItem){
    if(sItem.startsWith('bp:')){
      const id=parseInt(sItem.slice(3));
      const p=bps.find(b=>b.id===id);
      filtered=p?filtered.filter(o=>orderMatches(p,o)&&p.contents.includes(o.item)):filtered;
    } else if(sItem.includes('|||')){
      const sep=sItem.indexOf('|||');
      const id=parseInt(sItem.slice(0,sep)),it=sItem.slice(sep+3);
      const p=bps.find(b=>b.id===id);
      filtered=filtered.filter(o=>o.item===it&&(p?orderMatches(p,o):true));
    } else {
      filtered=filtered.filter(o=>o.item===sItem);
    }
  }

  if(!filtered.length){h+=`<div class="empty">無喊單</div>`;}
  else{
    h+=`<div style="overflow-x:auto"><table><thead><tr>
      <th>${esc(st.fieldNick)}</th><th>${esc(st.fieldItem)}</th>${isBox?'<th>所屬盒組</th>':''}<th>${esc(st.fieldQty)}</th><th>${esc(st.fieldPrice)}</th><th>小計</th><th>${esc(st.fieldNote)}</th><th>時間</th>${RO?'':'<th>操作</th>'}
    </tr></thead><tbody>`;
    for(const o of filtered){
      let boxName='';
      if(isBox){const bp=(g.boxProducts||[]).find(p=>orderMatches(p,o)&&p.contents.includes(o.item));boxName=bp?bp.name:'';}
      const pr=effPrice(g,o);
      const isTeam=!!_team[o.nick];
      const fxBadge=(!isTeam&&o.fixed==='slot'?` <span class="badge b-purple">固${o.fixedRank||''}</span>`:!isTeam&&o.fixed==='pick'?' <span class="badge b-teal">撿</span>':'')+(o.lift?' <span class="badge b-amber">提</span>':'');
      h+=`<tr><td>${isTeam?`<span style="color:#a32d2d;font-weight:bold">${esc(o.nick)}</span>`:esc(o.nick)}${fxBadge}</td><td>${esc(o.item)}</td>
        ${isBox?`<td>${boxName?`<span class="badge b-coral">${esc(boxName)}</span>`:`<span class="muted">未對應</span>`}</td>`:''}
        <td>${o.all?'<span class="badge b-green">已 all</span>':o.qty}</td><td>${pr?'$'+pr:'-'}</td><td>${o.all?'<span class="muted">依成團數</span>':pr?'$'+(o.qty*pr):'-'}</td>
        <td class="muted">${esc(o.note||'')}</td>
        <td class="muted" style="white-space:nowrap">${fmtTs(o.ts)}</td>
        ${RO?'':`<td style="white-space:nowrap"><button class="bs bg" onclick="showEditOrderModal(${g.id},${o.id})">編輯</button>
        <button class="bs bg" style="color:#a32d2d" onclick="delOrder(${g.id},${o.id})">刪除</button></td>`}</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;return h;
}

let _bpOpen={};
function toggleBpDetail(pid){_bpOpen[pid]=!_bpOpen[pid];render();}
let _spNick='',_spGid='',_spHide=false;
function showShipModal(){
  const db=loadDB();
  const team=getTeam();
  const nicks=Object.keys(team).sort();
  if(_spNick&&!team[_spNick])_spNick='';
  let rowsHtml='';
  if(_spNick){
    const gs=_spGid?db.groups.filter(g=>g.id===parseInt(_spGid)):db.groups;
    for(const g of gs){
      const list=getConfirmedOrders(g).filter(o=>o.nick===_spNick);
      if(!list.length)continue;
      const ship=g.ship||{};
      let rows='';
      const groupArrived=['已到貨','已結團'].includes(g.status);
      for(const o of list){
        const fullKey=`${o.bpId||''}|||${o.item}|||${o.bind?1:0}|||${_spNick}`;
        const st=ship[fullKey]||{};
        if(_spHide&&st.s)continue;
        const bp=(g.boxProducts||[]).find(p=>orderMatches(p,o)&&p.contents.includes(o.item));
        const label=bpItemLabel(bp,o.item)+(o.bind?'（綁）':'');
        const arrived=effArrived(g,fullKey);
        const arrCell=groupArrived&&!RO
          ?`<span class="badge ${arrived?'b-green':'b-red'}" style="cursor:pointer" title="點擊標記缺件/到貨" onclick="toggleShip(${g.id},'${encodeURIComponent(fullKey)}','na')">${arrived?'已到貨':'缺件'}</span>`
          :`<span class="badge ${arrived?'b-green':(groupArrived&&st.na)?'b-red':'b-amber'}">${arrived?'已到貨':(groupArrived&&st.na)?'缺件':'未到貨'}</span>`;
        rows+=`<tr><td>${esc(label)}</td><td style="text-align:center">${o.qty}</td>
          <td>${arrCell}</td>
          <td><span class="badge ${st.s?'b-green':'b-gray'}" style="cursor:pointer" title="點擊切換" onclick="toggleShip(${g.id},'${encodeURIComponent(fullKey)}','s')">${st.s?'已出貨':'未出貨'}</span></td></tr>`;
      }
      // 囤貨期限：轉成已到貨後 2 個月
      let storageLine='';
      if(groupArrived&&g.arrivedAt){
        const limit=new Date(g.arrivedAt);
        limit.setMonth(limit.getMonth()+2);
        const days=Math.ceil((limit-new Date())/86400000);
        const ds=`${limit.getFullYear()}/${String(limit.getMonth()+1).padStart(2,'0')}/${String(limit.getDate()).padStart(2,'0')}`;
        storageLine=days<0
          ?`<span class="badge b-red">囤貨期限 ${ds}（已逾期 ${-days} 天）</span>`
          :days<=14
            ?`<span class="badge b-amber">囤貨期限 ${ds}（剩 ${days} 天）</span>`
            :`<span class="badge b-gray">囤貨期限 ${ds}</span>`;
      }
      if(rows)rowsHtml+=`<h3 style="margin:10px 0 4px"><span onclick="closeModal();goGroup(${g.id})" style="cursor:pointer;color:var(--accent)" title="前往該團">${esc(g.name)}</span> ${storageLine}</h3>
        <div style="overflow-x:auto"><table><thead><tr><th>商品</th><th>數量</th><th>到貨</th><th>出貨</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if(!rowsHtml)rowsHtml='<div class="empty">無資料</div>';
  } else rowsHtml=nicks.length?'<div class="empty">請選擇固團成員暱稱</div>':'<div class="empty">尚未設定固團成員</div>';
  // 未選暱稱時團名下拉只有「顯示全部」；選了暱稱後才列出該成員有喊單的團
  const gidOptions=_spNick
    ?db.groups.filter(g=>getConfirmedOrders(g).some(o=>o.nick===_spNick))
    :[];
  if(_spGid&&!gidOptions.some(g=>g.id===parseInt(_spGid)))_spGid='';
  openModal(`<h3>個人貨況查詢</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <select onchange="_spNick=this.value;_spGid='';showShipModal()"><option value="">固團成員</option>${nicks.map(n=>`<option value="${esc(n)}" ${_spNick===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <select onchange="_spGid=this.value;showShipModal()"><option value="">顯示全部</option>${gidOptions.map(g=>`<option value="${g.id}" ${_spGid==g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;white-space:nowrap">
        <input type="checkbox" ${_spHide?'checked':''} onchange="_spHide=this.checked;showShipModal()">隱藏已出貨</label>
    </div>
    <div style="max-height:60vh;overflow-y:auto">${rowsHtml}</div>
    <div class="btn-row" style="margin-top:10px"><button onclick="closeModal()">關閉</button></div>`);
}
function effArrived(g,key){
  if(!['已到貨','已結團'].includes(g.status))return false;
  return !(((g.ship||{})[key]||{}).na);
}
function toggleShip(gid,keyEnc,field){
  const key=decodeURIComponent(keyEnc);
  upG(gid,g=>{if(!g.ship)g.ship={};const st=g.ship[key]||{};st[field]=st[field]?0:1;g.ship[key]=st;});
  showShipModal();
}
function toggleShipKey(gid,keyEnc,field){
  const key=decodeURIComponent(keyEnc);
  const f=field||'s';
  upG(gid,g=>{if(!g.ship)g.ship={};const st=g.ship[key]||{};st[f]=st[f]?0:1;g.ship[key]=st;});
  render();
}

function buildViewerDataJs(){
  const db=loadDB();
  const groups=JSON.parse(JSON.stringify(db.groups.filter(g=>g.type==='box')));
  for(const g of groups){
    for(const nick of Object.keys(g.pay||{}))delete g.pay[nick].pnote;
  }
  if(!groups.length)throw new Error('沒有可發布的拆盒團資料');

function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';
  const size=0x8000;
  for(let i=0;i<bytes.length;i+=size)bin+=String.fromCharCode(...bytes.subarray(i,i+size));
  return btoa(bin);
}
async function sha256Text(str){
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function githubPagesFileUrl(c,filePath){
  const path=filePath.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  return 'https://'+c.owner+'.github.io/'+encodeURIComponent(c.repo)+'/'+path;
}
function findDataImages(root){
  const found=new Map();
  const visit=value=>{
    if(!value||typeof value!=='object')return;
    for(const key of Object.keys(value)){
      const item=value[key];
      if(typeof item==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,/i.test(item)){
        if(!found.has(item))found.set(item,[]);
        found.get(item).push({parent:value,key});
      }else if(item&&typeof item==='object')visit(item);
    }
  };
  visit(root);
  return found;
}
async function uploadDataImage(c,dataUrl){
  const match=dataUrl.match(/^data:(image\/(?:png|jpeg|webp|gif));base64,(.+)$/i);
  if(!match)throw new Error('圖片格式無法上傳');
  const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'}[match[1].toLowerCase()]||'jpg';
  const hash=await sha256Text(dataUrl);
  const filePath='images/'+hash.slice(0,24)+'.'+ext;
  const existing=await ghFetch(c,filePath,{query:'?ref='+encodeURIComponent(c.branch),allow404:true});
  if(existing.status===404){
    await ghFetch(c,filePath,{method:'PUT',body:JSON.stringify({
      message:'Upload image from admin page',content:match[2],branch:c.branch
    })});
  }
  return githubPagesFileUrl(c,filePath);
}
async function migrateDataImagesToGithub(c){
  const db=loadDB();
  const images=findDataImages(db);
  if(!images.size)return 0;
  let done=0;
  for(const [dataUrl,refs] of images){
    setGhStatus('正在上傳圖片 '+(done+1)+' / '+images.size+'...');
    const url=await uploadDataImage(c,dataUrl);
    for(const ref of refs)ref.parent[ref.key]=url;
    saveDB(db);
    done++;
  }
  return done;
}
async function ghFetch(c,filePath,opts={}){
  const cleanPath=filePath.replace(/^\/+/, '');
  const url='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+cleanPath+(opts.query||'');
  const res=await fetch(url,{
    method:opts.method||'GET',
    headers:{
      'Authorization':'Bearer '+c.token,
      'Accept':opts.accept||'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',
      ...(opts.headers||{})
    },
    body:opts.body
  });
  if(!res.ok&&!(opts.allow404&&res.status===404)){
    const text=await res.text();
    throw new Error('GitHub 回應 '+res.status+'：'+text.slice(0,240));
  }
  return res;
}

async function githubPushData(){
  try{
    const c=ghRequireConfig();
    if(!confirm('要把目前管理頁資料同步到 GitHub，覆蓋 '+c.path+' 嗎？\n\n新圖片會自動上傳，不需要另外手動處理。'))return;
    const imageCount=await migrateDataImagesToGithub(c);
    const data=buildViewerDataJs();
    setGhStatus('正在取得 GitHub 檔案資訊...');
    const info=await ghFetch(c,c.path,{query:'?ref='+encodeURIComponent(c.branch)}).then(r=>r.json());

    await ghFetch(c,c.path,{
      method:'PUT',
      body:JSON.stringify({
        message:'Update data.js from admin page',
        content:utf8ToBase64(data),
        sha:info.sha,
        branch:c.branch
      })
    }).then(r=>r.json());
    setGhStatus('同步完成。'+(imageCount?'已自動上傳 '+imageCount+' 張圖片。':'')+' GitHub Pages 可能需要等幾十秒才會更新。');
  }catch(err){

  }
}

// 固位 pass 統計：特殊團（★）截團後，固位成員沒喊自己固位角色的商品即算一次 pass（連續累計）
// 只要在較新的特殊團裡有喊該角色，之前累積的 pass 次數就歸零重新算起
// 條件：該團有販售該角色（在某商品的款式中）；有喊單（綁單不算）即中斷連續紀錄
function passStats(){
  const db=loadDB(),team=db.fixedTeam||{},joinedMap=db.teamJoinedAt||{};
  // 依開團時間新→舊排序，逐團往回推算「連續 pass 次數」
  const byNew=(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||b.id-a.id;
  const starGroups=db.groups.filter(g=>g.type==='box'&&g.starGroup).sort(byNew);
  const res={};
  for(const[nick,slots]of Object.entries(team)){
    for(const[style,pos]of Object.entries(slots||{})){
      if(pos.t!=='slot')continue; // 只監控固位角色
      let count=0;
      const joinedAt=Number(joinedMap[nick])||0;
      for(const g of starGroups){
        const openedAt=groupOpenedAt(g);
        if(joinedAt&&openedAt&&openedAt<joinedAt)continue;
        const styles=new Set((g.boxProducts||[]).flatMap(p=>p.contents));
        if(!styles.has(style))continue; // 該團沒賣這個角色不算
        const hasOrder=g.orders.some(o=>!o.bind&&o.nick===nick&&o.item===style);
        if(hasOrder)break; // 進行中的星號團只要已喊，就立即把先前 pass 歸零
        if(g.status!=='進行中')count++; // 尚未截團且沒喊，暫時不增加 pass
      }
      if(count>0){res[nick]=res[nick]||{};res[nick][style]=count;}
    }
  }
  return res;
}
function ftOverviewRow(nick,slots){
  const summary=Object.entries(slots||{}).map(([s,pos])=>`${esc(s)} ${pos.t==='pick'?'撿漏':'固'+(pos.r||1)}`).join('、')||'<span class="muted">（無角色位）</span>';
  const joined=`加入 ${localDateValue(_ftJoinedAt[nick]).replace(/-/g,'/')}`;
  const note=_ftNotes[nick]?`<span class="muted" style="font-size:11px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis">${esc(_ftNotes[nick])}</span>`:'';
  const passHtml=Object.entries(_ftPass[nick]||{}).map(([s,n])=>
    `<span class="badge ${n>=2?'b-red':'b-amber'}" title="★${esc(s)} pass ${n} 次${n>=2?'，建議撤銷固位':''}">${n>=2?'⚠ ':''}★${esc(s)}×${n}</span>`).join(' ');
  return `<div class="ft-row" data-nick="${esc(nick)}" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border-bottom:.5px solid #fdf1f6">
    <strong style="color:#a32d2d;white-space:nowrap">${esc(nick)}</strong>
    <span class="muted" style="font-size:11px;white-space:nowrap">${joined}</span>
    <span style="flex:1;min-width:120px;font-size:12px">${summary}</span>
    ${passHtml}
    ${note}
    <button class="bs" onclick="renameFixedMember('${encodeURIComponent(nick)}')">改名</button>
    <button class="bs" onclick="ftExpand(this)">編輯</button></div>`;
}
function ftExpand(btn){
  const row=btn.closest('.ft-row');
  const nick=row.dataset.nick;
  row.outerHTML=ftMemberBlock(nick,_ftTeam[nick]||{});
}
function readFixedMemberBlock(member){
  const nick=member.dataset.nick,slots={};
  member.querySelectorAll('.ftSlot').forEach(chip=>{
    const style=chip.dataset.style,value=chip.querySelector('.ftSel')?.value;
    if(!style||!value)return;
    if(value==='pick')slots[style]={t:'pick'};
    else if(value.startsWith('slot:'))slots[style]={t:'slot',r:parseInt(value.slice(5))||1};
  });
  const note=member.querySelector('.ftNote')?.value.trim()||'';
  const dateValue=member.querySelector('.ftJoinedAt')?.value;
  const previous=Number(_ftJoinedAt[nick])||0;
  const joinedAt=dateValue===localDateValue(previous)?previous:(dateValue?new Date(dateValue+'T00:00:00').getTime():Date.now());
  return {nick,slots,note,joinedAt};
}
function saveFixedMember(btn){
  const member=btn.closest('.ft-member');if(!member)return;
  const data=readFixedMemberBlock(member),db=loadDB();
  db.fixedTeam[data.nick]=data.slots;
  if(data.note)db.teamNotes[data.nick]=data.note;else delete db.teamNotes[data.nick];
  db.teamJoinedAt[data.nick]=data.joinedAt;
  saveDB(db);
  _ftTeam[data.nick]=data.slots;
  if(data.note)_ftNotes[data.nick]=data.note;else delete _ftNotes[data.nick];
  _ftJoinedAt[data.nick]=data.joinedAt;
  _ftPass=passStats();
  member.outerHTML=ftOverviewRow(data.nick,data.slots);
  filterFixedMembers();render();
}
function cancelFixedMemberEdit(btn){
  const member=btn.closest('.ft-member');if(!member)return;
  const nick=member.dataset.nick;
  member.outerHTML=ftOverviewRow(nick,_ftTeam[nick]||{});
  filterFixedMembers();
}
function removeFixedMember(btn){
  const member=btn.closest('.ft-member');if(!member)return;
  const nick=member.dataset.nick;
  if(!confirm(`從固團成員移除「${nick}」？\n既有喊單不會刪除，但之後不再套用固位或撿漏順位。`))return;
  const db=loadDB();
  delete db.fixedTeam[nick];delete db.teamNotes[nick];delete db.teamJoinedAt[nick];
  saveDB(db);
  delete _ftTeam[nick];delete _ftNotes[nick];delete _ftJoinedAt[nick];
  member.remove();filterFixedMembers();render();
}
let _ftView='style',_ftSearch='';
function ftStyleCard(s,entries){
  const slots=entries.filter(x=>x.pos.t==='slot').sort((a,b)=>(a.pos.r||1)-(b.pos.r||1));
  const picks=entries.filter(x=>x.pos.t==='pick');
  const slotChips=slots.map(x=>{
    const passN=(_ftPass[x.nick]||{})[s]||0;
    const passBadge=passN>0?` <span style="color:${passN>=2?'#a32d2d':'#c08a3e'};font-weight:bold">${passN>=2?'注意 ':''}pass${passN}</span>`:'';
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid ${passN>=2?'#f3b8c4':'#e0ddf5'};border-radius:12px;padding:2px 8px 2px 3px;font-size:12px;white-space:nowrap">
      <span style="background:#534ab7;color:#fff;border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0">${x.pos.r||1}</span>${esc(x.nick)}${passBadge}</span>`;
  }).join('');
  const pickChips=picks.map(x=>`<span style="display:inline-flex;align-items:center;background:#fff;border:1px solid #cfe5e2;border-radius:12px;padding:2px 8px;font-size:12px;white-space:nowrap">${esc(x.nick)}</span>`).join('');
  return `<div style="background:#fef7fa;border-radius:8px;padding:10px;border:1px solid #f3dce5">
    <div style="font-weight:bold;font-size:14px;margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid #d8b44a">${esc(s)}</div>
    <div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:6px">
      <span style="font-size:11px;color:#534ab7;font-weight:bold;padding:2px 0;white-space:nowrap">固位</span>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${slotChips||'<span class="muted" style="font-size:12px;padding:2px 0">—</span>'}</div></div>
    <div style="display:flex;gap:6px;align-items:flex-start">
      <span style="font-size:11px;color:#2a7a6e;font-weight:bold;padding:2px 0;white-space:nowrap">撿漏</span>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${pickChips||'<span class="muted" style="font-size:12px;padding:2px 0">—</span>'}</div></div>
  </div>`;
}
function ftStyleView(){
  const byStyle={};
  for(const[nick,slots]of Object.entries(_ftTeam)){
    for(const[s,pos]of Object.entries(slots||{}))(byStyle[s]=byStyle[s]||[]).push({nick,pos});
  }
  const styles=Object.keys(byStyle);
  if(!styles.length)return '<div class="empty">尚無角色位設定</div>';
  const db=loadDB(),units=db.units||[],map=db.roleUnits||{};
  const sections=units.map(u=>({id:u.id,name:u.name,icon:u.icon||'',styles:styles.filter(s=>parseInt(map[s])===u.id)})).filter(x=>x.styles.length);
  const other=styles.filter(s=>!units.some(u=>u.id===parseInt(map[s])));
  if(other.length)sections.push({id:null,name:'未分類',icon:'',styles:other});
  return sections.map(section=>`<section style="margin-bottom:18px">
    <div style="display:flex;align-items:center;gap:7px;font-size:16px;font-weight:bold;color:#7d4357;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)">
      ${section.icon?`<img src="${section.icon}" style="width:24px;height:24px;object-fit:cover;border-radius:5px">`:''}${esc(section.name)}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px">
      ${section.styles.sort((a,b)=>a.localeCompare(b,'zh-Hant')).map(s=>ftStyleCard(s,byStyle[s])).join('')}
    </div></section>`).join('');
}
function filterFixedMembers(){
  const list=$('#ftList');if(!list)return;
  const query=String(_ftSearch||'').trim().toLocaleLowerCase();
  let visible=0;
  for(const member of list.querySelectorAll('.ft-row,.ft-member')){
    const matched=!query||String(member.dataset.nick||'').toLocaleLowerCase().includes(query);
    member.style.display=matched?'':'none';
    if(matched)visible++;
  }
  const empty=$('#ftSearchEmpty');
  if(empty)empty.style.display=visible?'none':'block';
}
function stashFixedTeamForm(){
  if(!$('#ftList'))return;
  const current=collectFixedTeamForm();
  _ftTeam=current.team;_ftNotes=current.notes;_ftJoinedAt=current.joinedAt;
}
function switchFtView(v){
  if(_ftView==='member')stashFixedTeamForm();
  _ftView=v;showFixedTeamModal(true);
}

  if(!keepTeam){
    _ftTeam=JSON.parse(JSON.stringify(getTeam()));
    _ftNotes=JSON.parse(JSON.stringify(loadDB().teamNotes||{}));
    _ftJoinedAt=JSON.parse(JSON.stringify(loadDB().teamJoinedAt||{}));

    <div style="display:flex;gap:4px;margin-bottom:10px">
      <button class="bs ${isStyle?'bp':''}" onclick="switchFtView('style')">依角色</button>
      <button class="bs ${isStyle?'':'bp'}" onclick="switchFtView('member')">依成員</button>
      <div style="flex:1"></div>
      <button class="bs" onclick="stashFixedTeamForm();showRolesModal()">編輯角色清單</button>

  } else {
    h+=`<p class="muted" style="margin-bottom:8px">點「編輯」展開調整角色位，同一款式只能擇一（固位或撿漏）。喊單時依暱稱自動套用到所有團。</p>
      <div style="display:flex;gap:6px;margin-bottom:10px;align-items:flex-end">
        <div class="form-group" style="flex:1"><label>新增成員暱稱</label><input id="ftNick"></div>
        <button class="bs bp" onclick="addTeamMember()" style="margin-bottom:2px">新增</button></div>
      <div class="form-group" style="margin-bottom:10px"><label>搜尋成員名稱</label>
        <input id="ftSearch" type="search" value="${esc(_ftSearch)}" placeholder="輸入部分名稱即可" oninput="_ftSearch=this.value;filterFixedMembers()"></div>
      <div id="ftList" style="max-height:50vh;overflow-y:auto">`;
    for(const[nick,slots]of Object.entries(_ftTeam))h+=ftOverviewRow(nick,slots||{});
    h+=`<div id="ftSearchEmpty" class="empty" style="display:none">找不到符合的成員</div></div>
      <div class="btn-row"><button onclick="closeModal()">關閉</button></div>`;
  }
  openModal(h);
  if(!isStyle){filterFixedMembers();setTimeout(()=>$('#ftNick')?.focus(),100);}

function addTeamMember(){
  const nick=$('#ftNick').value.trim();
  if(!nick){alert('請輸入暱稱');return;}
  const db=loadDB();
  if(Object.prototype.hasOwnProperty.call(db.fixedTeam||{},nick)){
    alert('成員已存在');return;
  }
  const joinedAt=Date.now();
  db.fixedTeam[nick]={};db.teamJoinedAt[nick]=joinedAt;
  saveDB(db);
  _ftTeam[nick]={};_ftJoinedAt[nick]=joinedAt;delete _ftNotes[nick];
  $('#ftList').insertAdjacentHTML('beforeend',ftMemberBlock(nick,{}));
  $('#ftNick').value='';
  filterFixedMembers();render();
}
function collectFixedTeamForm(){
  const team={},notes={},joinedAt={};
  document.querySelectorAll('#ftList .ft-row,#ftList .ft-member').forEach(el=>{
    const nick=el.dataset.nick;
    if(el.classList.contains('ft-row')){
      team[nick]=_ftTeam[nick]||{};
      if(_ftNotes[nick])notes[nick]=_ftNotes[nick];
      joinedAt[nick]=Number(_ftJoinedAt[nick])||Date.now();
      return;
    }
    const slots={};
    el.querySelectorAll('.ftSlot').forEach(chip=>{
      const style=chip.dataset.style,value=chip.querySelector('.ftSel')?.value;
      if(!style||!value)return;
      if(value==='pick')slots[style]={t:'pick'};
      else if(value.startsWith('slot:'))slots[style]={t:'slot',r:parseInt(value.slice(5))||1};
    });
    team[nick]=slots;
    const note=el.querySelector('.ftNote')?.value.trim();
    if(note)notes[nick]=note;
    const dateValue=el.querySelector('.ftJoinedAt')?.value;
    const previous=Number(_ftJoinedAt[nick])||0;
    joinedAt[nick]=dateValue===localDateValue(previous)?previous:(dateValue?new Date(dateValue+'T00:00:00').getTime():Date.now());
  });
  return {team,notes,joinedAt};
}
function nicknameInUse(db,nick){
  if(Object.prototype.hasOwnProperty.call(db.fixedTeam||{},nick))return true;
  if(Object.prototype.hasOwnProperty.call(db.buyers||{},nick))return true;
  return (db.groups||[]).some(g=>(g.orders||[]).some(o=>o.nick===nick)||Object.prototype.hasOwnProperty.call(g.pay||{},nick));
}
function renamePinNick(map,oldNick,newNick){
  for(const key of Object.keys(map||{})){
    const pin=map[key];
    if(typeof pin==='string'&&pin===oldNick)map[key]=newNick;
    else if(pin&&typeof pin==='object'&&pin.nick===oldNick)pin.nick=newNick;
  }
}
function renameMemberEverywhere(db,oldNick,newNick){
  db.fixedTeam[newNick]=db.fixedTeam[oldNick]||{};
  delete db.fixedTeam[oldNick];
  if(Object.prototype.hasOwnProperty.call(db.teamNotes||{},oldNick)){
    db.teamNotes[newNick]=db.teamNotes[oldNick];
    delete db.teamNotes[oldNick];
  }
  if(Object.prototype.hasOwnProperty.call(db.teamJoinedAt||{},oldNick)){
    db.teamJoinedAt[newNick]=db.teamJoinedAt[oldNick];
    delete db.teamJoinedAt[oldNick];
  }
  if(Object.prototype.hasOwnProperty.call(db.buyers||{},oldNick)){
    db.buyers[newNick]=db.buyers[oldNick];
    delete db.buyers[oldNick];
  }
  for(const g of db.groups||[]){
    for(const order of g.orders||[])if(order.nick===oldNick)order.nick=newNick;
    if(Object.prototype.hasOwnProperty.call(g.pay||{},oldNick)){
      g.pay[newNick]=g.pay[oldNick];
      delete g.pay[oldNick];
    }
    if(g.hiddenStatsNicks)g.hiddenStatsNicks=[...new Set(g.hiddenStatsNicks.map(n=>n===oldNick?newNick:n))];
    if(g.ship){
      const moved={};
      for(const[key,value]of Object.entries(g.ship)){
        const parts=key.split('|||');
        if(parts.length>=4&&parts[parts.length-1]===oldNick)parts[parts.length-1]=newNick;
        moved[parts.join('|||')]=value;
      }
      g.ship=moved;
    }
    for(const product of g.boxProducts||[]){
      renamePinNick(product.pins,oldNick,newNick);
      renamePinNick(product.frozenPins,oldNick,newNick);
      renamePinNick(product.layoutPins,oldNick,newNick);
      for(const pins of Object.values(product.blindAllocPins||{})){
        for(const pin of pins||[])if(pin&&pin.nick===oldNick)pin.nick=newNick;
      }
    }
  }
}
function renameFixedMember(oldNickEnc){
  const oldNick=decodeURIComponent(oldNickEnc);
  const next=prompt(`將「${oldNick}」改成：`,oldNick);
  if(next==null)return;
  const newNick=next.trim();
  if(!newNick){alert('新名字不可空白');return;}
  if(newNick===oldNick)return;
  const current=collectFixedTeamForm();
  _ftTeam=current.team;_ftNotes=current.notes;_ftJoinedAt=current.joinedAt;
  const db=loadDB();
  if(Object.prototype.hasOwnProperty.call(_ftTeam,newNick)||nicknameInUse(db,newNick)){
    alert(`「${newNick}」已經有人使用，不能直接合併。`);return;
  }
  if(!confirm(`確定將「${oldNick}」改成「${newNick}」？\n\n所有團的既有喊單、付款、貨況與配單位置會一起更新。`))return;
  renameMemberEverywhere(db,oldNick,newNick);
  _ftTeam[newNick]=_ftTeam[oldNick]||{};delete _ftTeam[oldNick];
  if(Object.prototype.hasOwnProperty.call(_ftNotes,oldNick)){
    _ftNotes[newNick]=_ftNotes[oldNick];delete _ftNotes[oldNick];
  }
  _ftJoinedAt[newNick]=_ftJoinedAt[oldNick]||Date.now();delete _ftJoinedAt[oldNick];
  saveDB(db);
  render();showFixedTeamModal(true);
}

// ── 團體庫（跨團共用，存於 db.units：{id,name,icon}） ──
let _unitIconTmp=null,_unitsReturnToRoles=false;
function getUnits(){return loadDB().units||[];}
function onUnitIconChange(input){
  imgFileToData(input.files[0],d=>{
    _unitIconTmp=d;
    const prev=$('#unitIconPrev');if(prev){prev.src=d;prev.style.display='inline-block';}
  },120,0.85);
}
document.addEventListener('paste',e=>{
  if(!$('#unitIconPrev'))return;
  for(const it of(e.clipboardData?.items||[])){
    if(it.type.startsWith('image/')){
      e.preventDefault();
      imgFileToData(it.getAsFile(),d=>{
        _unitIconTmp=d;
        const prev=$('#unitIconPrev');if(prev){prev.src=d;prev.style.display='inline-block';}
      },120,0.85);
      return;
    }
  }
});

function unitChip(u){
  return `<span class="unit-chip" data-id="${u.id}" style="display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 4px">
    ${u.icon?`<img src="${u.icon}" style="width:22px;height:22px;object-fit:cover;border-radius:5px">`:'<span style="width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);border-radius:5px;font-size:11px">?</span>'}
    <span style="font-size:12px">${esc(u.name)}</span>
    <span onclick="delUnit(${u.id})" style="cursor:pointer;color:#a32d2d;font-weight:bold;font-size:12px" title="刪除團體">✕</span></span>`;
}
function addUnit(){
  const name=$('#unitName').value.trim();
  if(!name){alert('請輸入團體名稱');return;}
  const db=loadDB();
  if(!db.units)db.units=[];
  if(!db.unitNid)db.unitNid=1;
  db.units.push({id:db.unitNid++,name,icon:_unitIconTmp||''});
  saveDB(db);
  $('#unitList').innerHTML=db.units.map(u=>unitChip(u)).join('');
  $('#unitName').value='';_unitIconTmp=null;
  const prev=$('#unitIconPrev');if(prev)prev.style.display='none';
}
function delUnit(id){
  if(!confirm('刪除此團體？已勾選此團體的團會一併移除關聯。'))return;
  const db=loadDB();
  db.units=(db.units||[]).filter(u=>u.id!==id);
  for(const g of db.groups){if(g.unitIds)g.unitIds=g.unitIds.filter(x=>x!==id);}
  for(const role of Object.keys(db.roleUnits||{}))if(parseInt(db.roleUnits[role])===id)delete db.roleUnits[role];
  saveDB(db);
  $('#unitList').innerHTML=db.units.map(u=>unitChip(u)).join('')||'<span class="muted">尚未建立團體</span>';
}

function toggleFixEnd(gid){
  const g=getG(gid);if(!g)return;
  const msg=g.fixEnded?'恢復固位優先？固位將重新依固位數優先排序。':'結束固位優先？此後新增的喊單，固位效力退化為撿漏；已喊的不受影響。';
  if(!confirm(msg))return;
  upG(gid,g=>{

}

function bpPriceMode(p){return p.priceMode||(p.adjustPrice?'adjust':'average');}
function bpHasItemPrices(p){return bpPriceMode(p)!=='average'&&p.itemPrices;}
function bpFinalItemPrice(p,item){return bpHasItemPrices(p)&&p.itemPrices[item]!=null?p.itemPrices[item]:(p.avgPrice||null);}
function bpDetailHtml(g,p){
  let h='';
  const isSingle=p.kind==='single';
  const shownContents=isSingle?p.contents.filter(c=>g.orders.some(o=>o.item===c&&orderMatches(p,o))):p.contents;
  if(p.img)h+=`<div class="bp-detail"><img class="bp-detail-img" src="${p.img}" onclick="event.stopPropagation();showImg(this.src)"><div style="flex:1;min-width:0;overflow-x:auto">`;
  h+=`<div style="font-size:12px;margin:8px 0 6px">款式：${shownContents.map(c=>{
    const pr=isSingle?(p.unitPrice||null):bpFinalItemPrice(p,c);
    return `<span style="display:inline-block;padding:1px 6px;margin:2px;background:#fdf1f6;border-radius:4px">${esc(c)}${pr!=null?' $'+pr:''}</span>`;
  }).join('')}</div>`;

  if(isSingle){
    h+=`<div style="overflow-x:auto"><table><thead><tr><th>款式</th><th>單價</th><th>已喊</th><th>喊單者</th></tr></thead><tbody>`;
    for(const c of shownContents){
      const buyers=g.orders.filter(o=>o.item===c&&orderMatches(p,o));
      const qty=buyers.reduce((s,o)=>s+o.qty,0);
      h+=`<tr><td>${esc(c)}</td><td>${p.unitPrice?'$'+p.unitPrice:'-'}</td><td>${qty}</td>
        <td class="muted">${buyers.map(b=>`${esc(b.nick)}×${b.qty}`).join(', ')}</td></tr>`;
    }
    if(!shownContents.length)h+=`<tr><td colspan="4" class="muted" style="text-align:center">尚無喊單</td></tr>`;
    h+=`</tbody></table></div>`;
    if(p.img)h+='</div></div>';
    return h;
  }

  const info=calcBoxes(g,p);
  const blindResult=p.kind==='blind'&&p.blindOpened;
  const blindActualSlots=blindResult?resolveBlindProductSlots(g,p):[];
  const blindActualKeys=new Set(blindActualSlots.map(slot=>JSON.stringify([slot.boxIdx,slot.item,slot.buyer.oid||0,!!slot.buyer.bind])));
  if(blindResult){
    const actual=aggregateProductSlots(g,p,blindActualSlots);
    h+=`<div style="margin:8px 0 12px;padding:10px;background:#fff9df;border:1px solid #ead48e;border-radius:6px">
      <div style="font-weight:bold;margin-bottom:7px">實際拆配結果</div>
      <div style="overflow-x:auto"><table><thead><tr><th>款式</th><th>實際開出</th><th>缺／爆配</th><th>依順位取得</th></tr></thead><tbody>
      ${p.contents.map(item=>{
        const rows=actual.filter(o=>o.item===item);
        const opened=Math.max(0,parseInt((p.blindCounts||{})[item])||0);
        const orders=(g.orders||[]).filter(o=>o.item===item&&orderMatches(p,o));
        const ordered=orders.filter(o=>!o.all).reduce((sum,o)=>sum+(Number(o.qty)||0),0);
        const wanted=orders.some(o=>o.all)?Math.max(ordered,opened):ordered;
        const diff=opened-wanted,diffText=diff>0?'+'+diff:String(diff);
        const diffColor=diff<0?'#a32d2d':diff>0?'#3b6d11':'';
        return `<tr><td>${esc(item)}</td><td>${opened}</td><td style="color:${diffColor};font-weight:${diff?'bold':'normal'}">${diffText}</td><td class="muted">${rows.map(o=>`${esc(o.nick)}×${o.qty}`).join('、')||'-'}</td></tr>`;
      }).join('')}</tbody></table></div>
    </div>`;
  }
  h+=`${bpPriceMode(p)==='adjust'?`<div style="font-size:12px;margin-bottom:6px;color:#534ab7">均價 ${p.avgPrice||0} · 各款合計 ${p.contents.reduce((s,c)=>(p.itemPrices?s+(p.itemPrices[c]||0):s),0)}</div>`:''}
    <div style="display:flex;gap:16px;font-size:13px;margin-bottom:10px;flex-wrap:wrap">
      <span>已成 <strong>${info.complete}</strong> 配</span>
      ${info.bindComplete?`<span style="color:#534ab7">含綁成團 <strong>${info.bindComplete}</strong> 配</span>`:''}
      ${p.maxBoxes?`<span>開 <strong>${info.boxesNeeded}</strong> 盒</span>`:'<span>有幾開幾</span>'}
      <span>餘量 <strong style="color:${info.surplus?'#a32d2d':'#3b6d11'}">${info.surplus}</strong> 個</span>
      ${p.maxBoxes||p.pricePerBox?`<span class="muted">${p.maxBoxes?'上限 '+p.maxBoxes+' 盒':''}${p.pricePerBox?(p.maxBoxes?' · ':'')+'$'+p.pricePerBox+'/盒':''}</span>`:''}
    </div>`;

  h+=`<div style="overflow-x:auto"><table><thead><tr><th>款式</th><th>單價</th><th>需求</th><th>供給 (${info.boxesNeeded}盒)</th><th>狀態</th><th>喊單者</th></tr></thead><tbody>`;
  for(const c of p.contents){
    const demand=info.demands[c]||0;
    const supply=info.boxesNeeded;
    const surplus=supply-demand;
    const buyers=info.buyerMap[c]||[];
    const itemPrice=bpFinalItemPrice(p,c);
    let st='';
    if(demand===0) st='<span class="badge b-red">無人喊</span>';
    else if(surplus>0) st=`<span class="badge b-amber">餘 ${surplus}</span>`;
    else st='<span class="badge b-green">已無</span>';
    h+=`<tr><td>${esc(c)}</td><td>${itemPrice!=null?'$'+itemPrice:'-'}</td><td>${demand}</td><td>${supply}</td><td>${st}</td>
      <td class="muted">${buyers.filter(b=>!b.all||b.qty>0).map(b=>`${esc(b.nick)}${b.bind?'(綁)':''}${b.all?'（已 all）':'×'+b.qty}`).join(', ')||'-'}</td></tr>`;
  }
  h+=`</tbody></table></div>`;

  const blindOpenedMax=blindResult?Math.max(0,...p.contents.map(item=>Math.max(0,parseInt((p.blindCounts||{})[item])||0))):0;
  const tableRows=Math.max(info.boxesNeeded,blindOpenedMax);
  if(tableRows>0){
    const bind=p.bindItems||{};
    let showN=tableRows;
    if(!p.maxBoxes&&!blindResult){
      const filled=info.boxes.filter(b=>b.every(s=>s.buyer)).length;
      showN=Math.min(info.boxesNeeded,filled+10);
    }
    h+=`<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th></th>
      ${p.contents.map(c=>`<th>${esc(c)}${bind[c]?` <span class="badge b-purple" style="font-size:9px">綁${bind[c]} · 序${(p.bindOrder||{})[c]||0}</span>`:''}</th>`).join('')}<th>狀態</th><th></th></tr></thead><tbody>`;
    for(let i=0;i<showN;i++){
      const box=info.boxes[i]||Object.assign(p.contents.map(item=>({item,buyer:null})),{status:'爆配',bindPlan:[]});
      const priceChanged=Object.keys(p.rowPrices||{}).some(key=>key.startsWith(i+'|||'));
      h+=`<tr><td style="white-space:nowrap;font-weight:bold">第 ${i+1} 配${priceChanged?' *':''}</td>`;
      const bindPlan=box.bindPlan||getBoxBindPlan(p,box);
      for(const slot of box){
        if(slot.buyer){
          const needBind=bindPlan.some(x=>x.nick===slot.buyer.nick&&x.binderItem===slot.item);
          const cellStyles=[];
          if(blindResult){
            const actualKey=JSON.stringify([i,slot.item,slot.buyer.oid||0,!!slot.buyer.bind]);
            if(blindActualKeys.has(actualKey))cellStyles.push('background:#e5f4e7');
            else cellStyles.push('background:#fde7ec');
          }
          if(needBind)cellStyles.push('color:#a32d2d','font-weight:bold');
          h+=`<td${cellStyles.length?` style="${cellStyles.join(';')}"`:''}>${esc(slot.buyer.nick)}${slot.buyer.all?'（all）':''}${slot.buyer.bind?'(綁)':''}${slot.buyer.manual?'*':''}<span class="slot-del" title="移除此格喊單" onclick="event.stopPropagation();removeSlotUnit(${g.id},${p.id},${i},'${encodeURIComponent(slot.item)}','${encodeURIComponent(slot.buyer.nick)}',${slot.buyer.bind?1:0})">✕</span></td>`;
        }
        else{
          const opened=Math.max(0,parseInt((p.blindCounts||{})[slot.item])||0);
          const emptyBg=blindResult&&i<opened?'#e5f4e7':'#fdf1f6';
          h+=`<td class="slot-empty" style="background:${emptyBg}" title="點擊追加喊單" onclick="fillSlot(${g.id},${p.id},${i},'${encodeURIComponent(slot.item)}')"></td>`;
        }
      }
      const sb=box.status==='成團'||box.status==='爆配'?'b-green':box.status==='含綁成團'?'b-purple':'b-amber';
      h+=`<td><span class="badge ${sb}">${box.status}</span></td>`;
      h+=`<td><div style="display:flex;gap:4px;justify-content:flex-end">${bindPlan.length?`<button class="bs bp" onclick="event.stopPropagation();showBindModal(${g.id},${p.id},${i})">綁</button>`:''}${RO?'':`<button class="bs" onclick="event.stopPropagation();showBoxRowPriceModal(${g.id},${p.id},${i})">編輯價格</button>`}</div></td></tr>`;
    }
    if(showN<info.boxesNeeded)h+=`<tr><td colspan="${p.contents.length+3}" class="muted" style="text-align:center">…其餘 ${info.boxesNeeded-showN} 配未顯示</td></tr>`;
    h+=`</tbody></table></div>`;
  }
  if(p.img)h+='</div></div>';
  return h;
}

function showBoxRowPriceModal(gid,pid,boxIdx){
  const g=getG(gid),p=(g?.boxProducts||[]).find(x=>x.id===pid);if(!p)return;
  const rows=p.contents.map(item=>{
    const key=boxIdx+'|||'+item;
    const custom=Object.prototype.hasOwnProperty.call(p.rowPrices||{},key);
    const value=custom?p.rowPrices[key]:(bpFinalItemPrice(p,item)??0);
    return `<div class="form-group"><label>${esc(item)}${custom?' *':''}</label><input class="rowPriceInput" data-item="${esc(item)}" type="number" min="0" step="any" value="${value}"></div>`;
  }).join('');
  openModal(`<h3>第 ${boxIdx+1} 配價格</h3>
    <p class="muted" style="margin:6px 0 10px">可自由調整每一款價格，不限制合計金額。儲存後此配會標示 *。</p>
    <div class="form-row">${rows}</div>
    <div class="btn-row"><button class="bp" onclick="saveBoxRowPrices(${gid},${pid},${boxIdx})">儲存</button>
      <button class="bd" onclick="resetBoxRowPrices(${gid},${pid},${boxIdx})">重置此配</button>
      <button onclick="closeModal()">取消</button></div>`);
}
function saveBoxRowPrices(gid,pid,boxIdx){
  const values=[...document.querySelectorAll('.rowPriceInput')].map(input=>({item:input.dataset.item,price:Math.max(0,parseFloat(input.value)||0)}));
  upG(gid,g=>{
    const p=(g.boxProducts||[]).find(x=>x.id===pid);if(!p)return;
    if(!p.rowPrices)p.rowPrices={};
    for(const row of values)p.rowPrices[boxIdx+'|||'+row.item]=row.price;
  });
  closeModal();render();
}
function resetBoxRowPrices(gid,pid,boxIdx){
  if(!confirm(`重置第 ${boxIdx+1} 配的全部價格？`))return;
  upG(gid,g=>{
    const p=(g.boxProducts||[]).find(x=>x.id===pid);if(!p||!p.rowPrices)return;
    for(const key of Object.keys(p.rowPrices))if(key.startsWith(boxIdx+'|||'))delete p.rowPrices[key];
  });
  closeModal();render();
}

function hasUnconfirmedOrders(g,p,nick){
  const source={...g,orders:g.orders.filter(o=>!(o.bind&&o.autoBind&&orderMatches(p,o)))};
  const info=calcBoxes(source,p);
  for(const box of info.boxes){
    if(box.every(s=>s.buyer))continue;
    if(box.some(s=>s.buyer&&!s.buyer.bind&&s.buyer.nick===nick))return true;
  }
  return false;
}
function clearAutoBindOrders(g,p,item,qty,boxIdx){
  if(!p)return;
  let remaining=qty==null?Number.MAX_SAFE_INTEGER:Math.max(0,parseInt(qty)||0);
  const next=[];
  for(const o of g.orders){
    const matches=o.bind&&o.autoBind&&orderMatches(p,o)&&(item==null||o.item===item)&&(boxIdx==null||o.bindBox===boxIdx);
    if(!matches||remaining<=0){next.push(o);continue;}
    if(o.qty>remaining){o.qty-=remaining;remaining=0;next.push(o);}
    else remaining-=o.qty;
  }
  g.orders=next;
}

function removeSlotUnit(gid,pid,boxIdx,itemEnc,nickEnc,isBind){
  const item=decodeURIComponent(itemEnc),nick=decodeURIComponent(nickEnc),g=getG(gid);
  const p=(g?.boxProducts||[]).find(b=>b.id===pid);
  const source=g?.orders.find(o=>o.nick===nick&&o.item===item&&(!!o.bind)===(!!isBind)&&(p?orderMatches(p,o):true));
  if(!confirm(source?.all?`取消 ${nick} 對「${item}」的 all？`:`移除 ${nick} 的「${item}」1 個？`))return;
  upG(gid,g=>{
    const p=(g.boxProducts||[]).find(b=>b.id===pid);
    const key=boxIdx+'|||'+item;
    if(p&&g.keepTableOrderOnDelete)snapshotTableLayoutExcept(g,p,key);
    const o=g.orders.find(o=>o.nick===nick&&o.item===item&&(!!o.bind)===(!!isBind)&&(p?orderMatches(p,o):true));
    if(o){
      if(o.all)g.orders=g.orders.filter(x=>x!==o);
      else{o.qty-=1;if(o.qty<=0)g.orders=g.orders.filter(x=>x!==o);}
    }
    if(p){
      if(p.pins&&p.pins[key]===nick)delete p.pins[key];
      if(p.frozenPins&&p.frozenPins[key])delete p.frozenPins[key];
      if(p.layoutPins&&p.layoutPins[key])delete p.layoutPins[key];
    }
  });
  render();
}
function snapshotTableLayoutExcept(g,p,skipKey){
  const info=calcBoxes(g,p),layout={};
  info.boxes.forEach((box,boxIdx)=>{
    for(const slot of box){
      const key=boxIdx+'|||'+slot.item;
      if(key===skipKey||!slot.buyer)continue;
      layout[key]={nick:slot.buyer.nick,bind:!!slot.buyer.bind,oid:slot.buyer.oid||0};
    }
  });
  p.layoutPins=layout;
}
function fillSlot(gid,pid,boxIdx,itemEnc){

    <div class="form-group" style="margin:10px 0"><label>暱稱</label>
      <input id="fsNick" list="fsDl"><datalist id="fsDl">${nicks.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div style="margin-bottom:12px">
      <label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;white-space:nowrap">
        <input type="checkbox" id="fsLift">帶餘提配</label>
      <span class="muted" style="font-size:11px;margin-left:6px">提前此人的未成團喊單，也可取代含綁缺位；普通成團不會變動</span>
    </div>
    <div class="btn-row"><button class="bp" onclick="doFillSlot(${gid},${pid},${boxIdx},'${encodeURIComponent(item)}')">新增</button><button onclick="closeModal()">取消</button></div>`);
  setTimeout(()=>$('#fsNick').focus(),100);
}
function doFillSlot(gid,pid,boxIdx,itemEnc){
  const item=decodeURIComponent(itemEnc);
  const n=$('#fsNick').value.trim();
  if(!n){alert('請輸入暱稱');return;}
  const isLift=$('#fsLift').checked;
  const g=getG(gid);
  const p=(g.boxProducts||[]).find(b=>b.id===pid);if(!p)return;
  if(isLift){
    if(!hasUnconfirmedOrders(g,p,n)){alert(`${n} 在「${p.name}」沒有可提配的喊單，無法提配`);return;}
  }
  upG(gid,g2=>{
    const p2=(g2.boxProducts||[]).find(b=>b.id===pid);if(!p2)return;
    freezeConfirmedBoxes(g2,p2);
    clearAutoBindOrders(g2,p2,item,1);

    const ex=g2.orders.find(o=>!o.bind&&o.nick===n&&o.item===item&&orderMatches(p2,o)&&(!!o.lift)===isLift);

    else g2.orders.push({id:g2.nOid++,nick:n,item,series:'',qty:1,price:lookupPrice(g2,item,pid)||0,note:'',bpId:pid,lift:isLift,ts:Date.now()});

}

function applyBind(gid,pid,boxIdx){
  const picks=[...document.querySelectorAll('.bindSel')].map(s=>({item:s.dataset.item,nick:s.value})).filter(x=>x.nick);
  upG(gid,g=>{
